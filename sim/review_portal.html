<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>全部空间样本审核</title>
<style>*{box-sizing:border-box}body{margin:0;height:100dvh;overflow:hidden;background:#101827;color:#e5edf9;font:15px system-ui;display:flex;flex-direction:column}header{padding:20px 28px;border-bottom:1px solid #35445c;flex-shrink:0}h1{margin:0 0 10px;font-size:23px}p{line-height:1.5}header p{margin:8px 0}.muted{color:#a8b8cd;font-size:13px}a{color:#9dc9ff}input{width:min(420px,100%);padding:10px;border:1px solid #53637a;background:#172439;color:white;border-radius:8px;font:inherit}main{overflow:auto;padding:20px 28px;min-height:0;flex:1}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,310px),1fr));gap:16px}article{border:1px solid #384961;border-radius:12px;padding:18px;background:#172338;display:flex;flex-direction:column}article[hidden]{display:none}h2{font-size:18px;overflow-wrap:anywhere}.top{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:#b6c7da}.tag{color:#a4dcdb}nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}.button{display:inline-block;padding:9px 12px;border:1px solid #496685;border-radius:7px;text-decoration:none;background:#20364f}.button:hover{background:#304e70}.tools{display:flex;gap:18px;flex-wrap:wrap;align-items:center}#empty{display:none}</style>
<header><h1>全部空间样本审核 <span class="muted">共 <!--COUNT--> 个采集样本</span></h1><p class="muted">统一入口 · 视频与逐点审核 · 保留失败样本。现有页面预测可能是早期基线，不代表最新算法试验；AI标签不等于人工真值。审核记录保存在各页面当前浏览器，请定期导出备份。</p><div class="tools"><input id="search" aria-label="搜索样本" placeholder="搜索编号、学校、家庭、HSSD或用途…"><label>来源 <select id="kind"><option value="">全部</option><option value="memory">学校记忆诊断</option><option value="hssd">HSSD</option><option value="home">家庭</option></select></label><label>输入状态 <select id="ready"><option value="">全部</option><option value="true">可审核</option><option value="false">采集失败</option></select></label><span id="shown" role="status"></span><a href="hssd-videos/">HSSD视频总览</a><a href="hssd-videos/results.html">首批基线结果（非最新试验）</a></div></header>
<style>select{padding:9px;border:1px solid #53637a;background:#172439;color:white;border-radius:8px;font:inherit}.tools label{display:flex;align-items:center;gap:6px}a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #8ddbd8}</style><main><section class="grid"><!--CARDS--></section><p id="empty">没有匹配样本。</p></main>
<script>const search=document.getElementById('search'),kind=document.getElementById('kind'),ready=document.getElementById('ready');function filter(){const value=search.value.trim().toLowerCase();let shown=0;document.querySelectorAll('article').forEach(card=>{card.hidden=!card.dataset.search.toLowerCase().includes(value)||(kind.value&&card.dataset.kind!==kind.value)||(ready.value&&card.dataset.ready!==ready.value);if(!card.hidden)shown++});document.getElementById('empty').style.display=shown?'none':'block';document.getElementById('shown').textContent=`显示 ${shown} 个样本`}for(const control of [search,kind,ready])control.addEventListener('input',filter);filter();</script></html>
