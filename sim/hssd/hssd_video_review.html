<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HSSD 六例视频审核</title>
<style>*{box-sizing:border-box}body{margin:0;background:#111827;color:#e5e7eb;font:15px system-ui;height:100dvh;overflow:hidden}button,select,textarea,input{font:inherit}button,select{background:#253248;color:white;border:1px solid #50627b;border-radius:6px;padding:7px 12px;cursor:pointer}button:disabled{opacity:.45;cursor:default}header{height:62px;display:flex;align-items:center;gap:12px;padding:10px 18px;border-bottom:1px solid #39465a}h1{font-size:19px;margin:0}.layout{height:calc(100dvh - 62px);display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;padding:14px}.media{min-height:0;display:flex;flex-direction:column;gap:10px}video{width:100%;flex:1;min-height:0;background:#050505;object-fit:contain}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.muted{color:#acb8cb;font-size:12px}aside{display:flex;flex-direction:column;gap:12px;min-height:0;overflow:auto}textarea{width:100%;height:90px;resize:vertical;background:#1c2739;color:white;border:1px solid #526278;padding:8px;border-radius:6px}.points{min-height:65px;overflow:auto;flex:1}.points button{display:block;text-align:left;width:100%;margin-bottom:6px}#fail{background:#733535}#pass{background:#245c48}#clock{font-variant-numeric:tabular-nums}dialog{background:#172236;color:white;border:1px solid #687890;border-radius:10px;max-height:80vh;overflow:auto}dialog button{display:block;width:100%;margin:7px 0}pre{white-space:pre-wrap;font-size:12px;overflow:auto;max-height:150px}a{color:#93c5fd}@media(max-width:760px){.layout{grid-template-columns:minmax(0,1fr) 280px;gap:8px;padding:8px}h1{font-size:15px}header{gap:6px;padding:8px}}</style>
<header><a href="../">返回全部样本</a><h1>六例视频审核</h1><button id="switch">切换样本</button><span id="title"></span><button id="export">导出全部审核</button></header>
<div class="layout"><section class="media"><video id="video" controls muted playsinline preload="metadata"></video><input id="seek" type="range" min="0" max="1" step=".04"><div class="row"><button id="back">−5秒</button><button id="forward">＋5秒</button><select id="speed"><option>.5</option><option selected>1</option><option>1.5</option><option>2</option></select><span id="clock">等待视频</span></div><span class="muted">左／前／右有分隔缝；24fps实际动作逐帧渲染，没有交叉淡化或重复原帧平滑。未完成回访会明确提示。</span></section>
<aside><strong id="scene"></strong><span id="state"></span><span class="muted">审核对象：视频／采集质量与空间可理解性，不是算法正确率认证；无需填写姓名。</span><textarea id="reason" placeholder="不通过的理由（必填）；通过时可留备注"></textarea><div class="row"><button id="pass">视频通过</button><button id="fail">视频不通过</button></div><span id="feedback" aria-live="polite"></span><textarea id="point" placeholder="当前时间点的问题，例如画面过暗、穿墙、卡顿、转动过快"></textarea><button id="add">记录当前时间点</button><div id="points" class="points"></div><details><summary>已有AI标签与预测（仅参考）</summary><pre id="ai"></pre></details><span class="muted">HSSD · Khanna等 · <a href="https://3dlg-hcvc.github.io/hssd/">来源</a> · <a href="https://creativecommons.org/licenses/by-nc/4.0/">CC BY-NC 4.0</a>。模拟衍生渲染，仅非商业审核。</span></aside></div>
<dialog id="dialog"><h3>选择视频</h3><div id="options"></div><button id="close">关闭</button></dialog>
<script>(async()=>{const $=id=>document.getElementById(id),v=$('video');let data,index=0,reviews={},drag=false;const key='hssd-six-video-review-v1';try{reviews=JSON.parse(localStorage.getItem(key)||'{}')}catch{}const save=()=>{try{localStorage.setItem(key,JSON.stringify(reviews))}catch{$('feedback').textContent='本地保存失败，请导出备份'}};
const row=()=>data?.scenes[index],record=()=>{const r=reviews[row().sceneId];return r?.videoSha256===row().videoSha256?r:{}},time=t=>`${Math.floor(t/60)}:${String(Math.floor(t%60)).padStart(2,'0')}`;
function points(){const r=record();$('reason').value=r.reason||'';$('points').replaceChildren();for(const p of r.points||[]){const b=document.createElement('button');b.textContent=`${time(p.seconds)} · ${p.reason}`;b.onclick=()=>{v.pause();v.currentTime=p.seconds};$('points').append(b)}}
function ai(){const s=row(),sample=s.samples?.findLast(x=>x.seconds<=v.currentTime);$('ai').textContent=sample?JSON.stringify({时间:sample.seconds,原AI建议:sample.aiReview||'尚无，待审核',算法预测:sample.prediction||'未知'},null,2):'尚无AI结果，不阻塞视频审核。'}
function choose(i){index=i;const s=row(),r=record();v.pause();if(s.ready){v.src=s.video;v.load()}else{v.removeAttribute('src');v.load()}$('title').textContent=`${i+1}/6 · ${s.name}`;$('scene').textContent=s.sceneId;$('state').textContent=s.ready?`${s.samples?.length||s.sampleCount}观察点 · ${s.completedRoute?'已完成路线与回访':'路线达到预算截断／未完成回访'}`:'视频尚未就绪，采集中';$('feedback').textContent=r.decision==='pass'?'已通过，已本地保存':r.decision==='fail'?'未通过，已本地保存':'未审核';for(const id of ['pass','fail','add'])$(id).disabled=!s.ready;points();ai();$('point').value='';$('dialog').close()}
async function load(){const old=row()?.sceneId||new URLSearchParams(location.search).get('scene');data=await fetch('catalog.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('目录加载失败');return r.json()});const i=data.scenes.findIndex(s=>s.sceneId===old);choose(i<0?0:i)}
$('switch').onclick=()=>{v.pause();$('options').replaceChildren();data.scenes.forEach((s,i)=>{const b=document.createElement('button');const r=reviews[s.sceneId];b.textContent=`${i+1}. ${s.name} · ${s.ready?'可播放':'未就绪'} · ${r?.decision==='pass'?'通过':r?.decision==='fail'?'不通过':'未审核'}`;b.onclick=()=>choose(i);$('options').append(b)});const refresh=document.createElement('button');refresh.textContent='刷新视频就绪状态';refresh.onclick=()=>load().catch(e=>$('feedback').textContent=e.message);$('options').append(refresh);$('dialog').showModal()};$('close').onclick=()=>$('dialog').close();v.onloadedmetadata=()=>{$('seek').max=v.duration;$('clock').textContent=`0:00 / ${time(v.duration)}`};v.ontimeupdate=()=>{if(!drag)$('seek').value=v.currentTime;$('clock').textContent=`${time(v.currentTime)} / ${time(v.duration||0)}`;ai()};$('seek').onpointerdown=()=>{drag=true;v.pause()};$('seek').oninput=()=>{$('clock').textContent=time(Number($('seek').value))};const seek=()=>{drag=false;if(v.src)v.currentTime=Number($('seek').value)};$('seek').onchange=seek;$('seek').onpointerup=seek;$('seek').onpointercancel=()=>drag=false;for(const [id,delta] of [['back',-5],['forward',5]])$(id).onclick=()=>{v.pause();v.currentTime=Math.max(0,Math.min(v.duration||0,v.currentTime+delta))};$('speed').onchange=()=>v.playbackRate=Number($('speed').value);v.onerror=()=>{$('feedback').textContent='视频未就绪或加载失败，请刷新状态'};
function decide(decision){v.pause();const reason=$('reason').value.trim();if(decision==='fail'&&!reason){$('feedback').textContent='请填写不通过理由';$('reason').focus();return}const s=row();reviews[s.sceneId]={...record(),decision,reason,videoSha256:s.videoSha256,reviewTarget:'video-capture-quality',reviewedAt:new Date().toISOString()};save();$('feedback').textContent='已本地保存；请导出备份'}$('pass').onclick=()=>decide('pass');$('fail').onclick=()=>decide('fail');$('add').onclick=()=>{v.pause();const reason=$('point').value.trim();if(!reason){$('feedback').textContent='请填写该时间点的问题';return}const s=row(),r=record();reviews[s.sceneId]={...r,videoSha256:s.videoSha256,points:[...(r.points||[]),{seconds:Number(v.currentTime.toFixed(3)),reason}]};save();points();$('point').value='';$('feedback').textContent='时间点已保存'};$('export').onclick=()=>{const a=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify({protocol:'hssd-human-video-review-v1',reviewTarget:'video-capture-quality',assistedByAI:true,independentRegionGroundTruth:false,exportedAt:new Date().toISOString(),scenes:data.scenes.map(s=>({sceneId:s.sceneId,videoSha256:s.videoSha256,...(reviews[s.sceneId]||{decision:'unreviewed'})}))},null,2)],{type:'application/json'}));a.href=url;a.download='hssd-six-video-review.json';a.click();URL.revokeObjectURL(url)};await load()})().catch(e=>document.getElementById('feedback').textContent=e.message);</script></html>
