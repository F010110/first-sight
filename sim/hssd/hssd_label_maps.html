<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HSSD标签地图与图像证据</title>
<style>*{box-sizing:border-box}body{margin:0;height:100dvh;overflow:hidden;background:#101827;color:#e3edf9;font:14px system-ui;display:flex;flex-direction:column}header{padding:12px 18px;border-bottom:1px solid #384a63;display:flex;gap:14px;align-items:center;flex-wrap:wrap}h1{font-size:18px;margin:0}a{color:#a8d3ff}button,select,input{font:inherit}select,button{background:#25364c;color:#fff;border:1px solid #546b87;border-radius:5px;padding:6px}main{min-height:0;flex:1;display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:12px;padding:12px}.maps{min-height:0;display:flex;flex-direction:column;gap:8px}.pair{flex:1;min-height:200px;display:grid;grid-template-columns:1fr 1fr;gap:10px}.panel{border:1px solid #3c506b;border-radius:8px;min-height:0;display:flex;flex-direction:column;padding:8px}svg{width:100%;flex:1;min-height:0;background:#172236}circle{cursor:pointer}circle:focus{stroke:white;stroke-width:3;outline:none}text{font-family:system-ui;pointer-events:none}.legend{max-height:100px;overflow:auto;font-size:12px}.legend span{display:inline-block;margin:4px 10px 4px 0}.image{width:100%;max-height:27vh;object-fit:contain;background:#05080d}aside{overflow:auto;min-height:0;background:#172338;border:1px solid #384a63;border-radius:8px;padding:12px}p{line-height:1.55;white-space:pre-wrap}h2{font-size:15px}h3{font-size:14px}.muted{color:#afbdd0;font-size:12px}.selected{stroke:#fff;stroke-width:3}.controls{display:flex;gap:8px;align-items:center}#seek{flex:1}#notice{margin:0}.detail{border-top:1px solid #3b4e66;margin-top:12px;padding-top:8px}@media(max-width:850px){main{grid-template-columns:minmax(0,1fr) 280px}.pair{grid-template-columns:1fr}.legend{max-height:60px}}</style>
<header><a href="../">全部样本</a><h1>AI标签／预测地图</h1><select id="scene" aria-label="选择场景"></select><a id="video" href="../hssd-videos/">查看视频</a></header>
<main><section class="maps"><p class="muted" id="notice"></p><div class="pair"><section class="panel"><strong>原AI参考划分（不是标准答案）</strong><svg id="left" viewBox="0 0 600 420" role="img" aria-label="参考标签轨迹地图"></svg><div class="legend" id="legend-left"></div></section><section class="panel"><select id="source" aria-label="选择预测方案"><option value="single-observation">逐观察VLM聚合</option><option value="time-2">每2观察分块＋VLM聚合</option></select><svg id="right" viewBox="0 0 600 420" role="img" aria-label="预测轨迹地图"></svg><div class="legend" id="legend-right"></div></section></div><div class="controls"><button id="prev">上一观察</button><input id="seek" type="range" min="0" max="0" value="0" step="1" aria-label="选择观察"><button id="next">下一观察</button><span id="point"></span></div><img id="image" class="image" alt="当前观察的原始左／前／右三视图"></section><aside><strong>先看证据，不显示一致率排行榜</strong><p class="muted">两侧地图使用相同X/Z投影。颜色仅标各方案自己的身份；同颜色不保证跨方案同区域。圆点位置可能重叠，使用下方滑块逐张检查。菱形＝交界，灰色＝未知。</p><div id="details"></div><details><summary>此前数字是怎么计算的？</summary><p>AI只生成逐图标签和聚合解释，并没有直接打分。程序按观察编号展开预测，再寻找预测身份与参考身份的最佳一对一对应；匹配不上、未知或内部点被标成边界，就记为不一致。边界单独比较类别。这会惩罚开放空间的一种合理合并，因此这里保留两套原始划分和理由，不将不一致自动叫作错误。</p></details><p id="failure"></p></aside></main>
<script>
(async()=>{const $=id=>document.getElementById(id),NS='http://www.w3.org/2000/svg',palette=['#5eb4ff','#f7b267','#91d18b','#e78ac3','#b89bff','#4fd1c5','#e2cb68','#ff8383','#9ac5a7'];let data,current,index=0;
const node=(name,attrs)=>{const element=document.createElementNS(NS,name);for(const [key,value] of Object.entries(attrs))element.setAttribute(key,value);return element};
function color(source,id){const i=source.regions.findIndex(r=>r.id===id);return i<0?'#95a1b3':palette[i%palette.length]}
function draw(svgId,source){const svg=$(svgId);svg.replaceChildren();if(!current.ready)return;const points=current.trajectory;const xs=points.map(p=>p[0]),zs=points.map(p=>p[1]);const minX=Math.min(...xs),minZ=Math.min(...zs),scale=Math.min(530/Math.max(.5,Math.max(...xs)-minX),350/Math.max(.5,Math.max(...zs)-minZ));const project=(x,z)=>[35+(x-minX)*scale,385-(z-minZ)*scale];
svg.append(node('polyline',{points:points.map(p=>project(...p).join(',')).join(' '),fill:'none',stroke:'#64758e','stroke-width':1.4,opacity:.65}));
current.samples.forEach((sample,i)=>{const label=source.labels[sample.id],p=project(sample.x,sample.z),selected=i===index;const group=node('g',{});const marker=label.kind==='boundary'?node('polygon',{points:`${p[0]},${p[1]-7} ${p[0]+7},${p[1]} ${p[0]},${p[1]+7} ${p[0]-7},${p[1]}`,fill:color(source,label.regionIds[0]),stroke:'#f8f8f8','stroke-width':selected?3:1,tabindex:0,role:'button','aria-label':sample.id}):node('circle',{cx:p[0],cy:p[1],r:selected?7:5,fill:color(source,label.regionIds[0]),stroke:selected?'white':'#101827','stroke-width':selected?3:1,tabindex:0,role:'button','aria-label':sample.id});marker.onclick=()=>choose(i);marker.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();choose(i)}};const title=node('title',{});title.textContent=sample.id+' '+label.kind+' '+label.regionIds.join('/');marker.append(title);group.append(marker);if(selected){const text=node('text',{x:p[0]+10,y:p[1]-10,fill:'white','font-size':13});text.textContent=sample.id;group.append(text)}svg.append(group)});
const legend=$('legend-'+svgId);legend.replaceChildren();for(const region of source.regions){const item=document.createElement('span');item.style.color=color(source,region.id);item.textContent=region.id+' · '+region.description.slice(0,32);item.title=region.description;legend.append(item)}}
function detail(name,source,sample){const wrapper=document.createElement('section');wrapper.className='detail';const h=document.createElement('h3');h.textContent=name;wrapper.append(h);const label=source.labels[sample.id];const p=document.createElement('p');p.textContent=`${label.kind==='core'?'内部':label.kind==='boundary'?'交界':'未知'} · ${label.regionIds.join(' / ')||'未绑定区域'}${label.unit?' · 输入单元 '+label.unit:''}\n${label.reason}`;wrapper.append(p);for(const id of label.regionIds){const r=source.regions.find(r=>r.id===id);if(r){const text=document.createElement('p');text.className='muted';text.textContent=id+'：'+r.description;wrapper.append(text)}}const annotations=(source.annotations||[]).filter(r=>r.observationRef.split(':')[1]===sample.id);for(const annotation of annotations){const text=document.createElement('p');text.className='muted';text.textContent='原附注（不改主体）：'+annotation.kind+' · '+annotation.reason;wrapper.append(text)}return wrapper}
function choose(i){if(!current.ready)return;index=Math.max(0,Math.min(current.samples.length-1,i));const sample=current.samples[index];$('seek').value=index;$('point').textContent=`${index+1}/${current.samples.length} · ${sample.seconds.toFixed(1)}秒`;$('image').src=sample.image;$('image').alt=sample.id+' 原始左／前／右三视图';$('details').replaceChildren(detail('原AI参考',current.sources.reference,sample),detail('当前VLM预测',current.sources[$('source').value],sample));draw('left',current.sources.reference);draw('right',current.sources[$('source').value])}
function scene(){current=data.scenes.find(s=>s.id===$('scene').value);$('video').href='../hssd-videos/?scene='+encodeURIComponent(current.id);$('failure').textContent=current.ready?'':current.reason;for(const id of ['prev','next','seek','source'])$(id).disabled=!current.ready;$('details').replaceChildren();$('image').removeAttribute('src');if(current.ready){$('seek').max=current.samples.length-1;choose(0)}else{$('left').replaceChildren();$('right').replaceChildren();$('legend-left').replaceChildren();$('legend-right').replaceChildren();$('point').textContent='无有效输入'}}
data=await fetch('data.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('地图加载失败');return r.json()});$('notice').textContent=data.notice;for(const s of data.scenes){const option=document.createElement('option');option.value=s.id;option.textContent=s.id+(s.ready?'':' · 采集失败');$('scene').append(option)}const requested=new URLSearchParams(location.search).get('scene');if(data.scenes.some(s=>s.id===requested))$('scene').value=requested;$('scene').onchange=scene;$('source').onchange=()=>choose(index);$('seek').oninput=e=>choose(Number(e.target.value));$('prev').onclick=()=>choose(index-1);$('next').onclick=()=>choose(index+1);scene();})().catch(e=>document.getElementById('failure').textContent=e.message);
</script></html>
