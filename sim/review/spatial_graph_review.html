<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>空间地点轨迹审核</title>
<style>body{margin:0;background:#111827;color:#e5e7eb;font:14px system-ui}header,section{padding:14px}button,select,input,textarea{background:#1f2937;color:#fff;border:1px solid #566278;border-radius:5px;padding:6px}button{cursor:pointer}header{border-bottom:1px solid #374151}main{display:grid;grid-template-columns:minmax(500px,1.6fr) minmax(340px,1fr)}svg{width:100%;height:65vh;background:#f3f4f6;touch-action:none}h2{font-size:17px}.muted{color:#abb7c8}.warning{color:#fbbf24}#places,#pairs{max-height:240px;overflow:auto}#places button,#pairs button{display:block;width:100%;text-align:left;margin:4px 0}.views{display:grid;grid-template-columns:1fr 2.2fr 1fr;gap:4px}.views img{width:100%;align-self:center}textarea{width:95%;height:80px}#compare{border-top:1px solid #566278;margin-top:15px}#message{white-space:pre-wrap}circle{cursor:pointer}#summary{white-space:pre-wrap}@media(max-width:900px){main{display:block}}</style>
<header><h1 id="title">轨迹审核</h1><p id="warning" class="warning"></p><div id="stats"></div>
录像 <select id="episode"><option value="all">全部（不跨录像连线）</option></select>
<label><input type="checkbox" id="heightEnabled">筛选原生Z（不是楼层号）</label> <input type="range" id="height" step="0.1"><span id="heightText"></span>
<button id="fit">全图</button> <button id="zoomIn">放大</button> <button id="zoomOut">缩小</button> <button id="export">导出审核记录</button> <label>导入 <input type="file" id="import" accept="application/json"></label><p id="message"></p></header>
<main><section><svg id="map" viewBox="0 0 1000 700" role="img" aria-label="原生XY轨迹与模型地点标签"></svg><p class="muted">原生X/Y，单位米；无真实北向认证。滚轮缩放、空白处拖动平移；点或P编号可打开原图。图中线不是墙，也不是导航保证。</p>
<h2>地点目录（P号仅是UUID显示别名）</h2><div id="places"></div><h2>几何接近的不同地点候选</h2><p class="muted">仅用于优先人工看图，接近不等于误拆。跨段可能不同楼层。</p><div id="pairs"></div></section>
<section><h2 id="selected">请选择轨迹点</h2><p id="meta"></p><div class="views"><img id="left" alt="左视图"><img id="front" alt="前视图"><img id="right" alt="右视图"></div><p id="reason"></p><p id="summary"></p>
<label>地点审核 <select id="status"><option value="pending">未审核</option><option value="looks-consistent">目前看一致</option><option value="possible-merge">疑似应合并</option><option value="possible-split">疑似应拆分</option><option value="uncertain">无法确定</option></select></label><p><textarea id="notes" placeholder="注明对比P号、是否不同楼层、边界依据；不要只凭几何距离判断"></textarea></p><button id="save">保存此地点意见</button><p class="muted">保存在当前浏览器；请导出JSON作持久备份。不会改算法、图或评测标签。</p>
<div id="compare" hidden><h2 id="compareTitle"></h2><div class="views"><img id="compareLeft" alt="对比左图"><img id="compareFront" alt="对比前图"><img id="compareRight" alt="对比右图"></div><p id="compareMeta"></p></div></section></main>
<script>
const $=id=>document.getElementById(id);let data,selected=null,comparison=null,records={},key,box=[0,0,1000,700],drag=null;const points=new Map(),places=new Map();
function color(n){return n?`hsl(${(n*137.508)%360} 70% 42%)`:'#777'}
function validateRecords(value,fingerprint,ids){if(value.protocol!=='spatial-graph-review-notes-v1'||value.fingerprint!==fingerprint||!value.records||typeof value.records!=='object'||Array.isArray(value.records))throw Error('审核文件与此冻结图不匹配');const allowed=new Set(['pending','looks-consistent','possible-merge','possible-split','uncertain']);for(const [id,r] of Object.entries(value.records))if(!ids.has(id)||!r||!allowed.has(r.status)||typeof r.notes!=='string'||r.notes.length>4000)throw Error('审核记录字段无效');return value.records}
function visible(p){return ($('episode').value==='all'||p.episode===Number($('episode').value))&&(!$('heightEnabled').checked||Math.abs(p.xyz[2]-Number($('height').value))<=.75)}
let xy;function project(p){return [(p.xyz[0]-xy.minX)*xy.scale+35,665-(p.xyz[1]-xy.minY)*xy.scale]}
function setBox(){ $('map').setAttribute('viewBox',box.join(' ')) }
function zoom(f){const [x,y,w,h]=box;if(w*f<30||w*f>4000)return;box=[x+w*(1-f)/2,y+h*(1-f)/2,w*f,h*f];setBox()}
function draw(){
 const ns='http://www.w3.org/2000/svg',svg=$('map');svg.replaceChildren();const add=(tag,attrs)=>{const e=document.createElementNS(ns,tag);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,v);svg.append(e);return e};
 const shown=data.samples.filter(visible),shownIds=new Set(shown.map(p=>p.id));
 for(let i=1;i<data.samples.length;i++){const a=data.samples[i-1],b=data.samples[i];if(a.episode!==b.episode||!shownIds.has(a.id)||!shownIds.has(b.id))continue;const [x1,y1]=project(a),[x2,y2]=project(b);add('line',{x1,y1,x2,y2,stroke:'#9ca3af','stroke-width':1,opacity:.55});}
 const groups=new Map();for(const p of shown){const [cx,cy]=project(p),active=p.placeId===selected?.placeId;const c=add('circle',{cx,cy,r:p.id===selected?.id||p.id===comparison?.id?8:active?5:3.2,fill:color(p.placeNumber),stroke:p.id===comparison?.id?'#000':active?'#111':'none','stroke-width':1});const title=document.createElementNS(ns,'title');title.textContent=`P${p.placeNumber??'?'} · 录像${p.episode} · ${p.sourceAtMs/1000}s · Z ${p.xyz[2].toFixed(2)}`;c.append(title);c.onclick=e=>{e.stopPropagation();select(p.id)};if(p.placeId){if(!groups.has(p.placeId))groups.set(p.placeId,[]);groups.get(p.placeId).push(p)}}
 for(const [id,group] of groups){const projected=group.map(project),x=projected.reduce((s,p)=>s+p[0],0)/group.length,y=projected.reduce((s,p)=>s+p[1],0)/group.length;const text=add('text',{x,y,fill:color(group[0].placeNumber),'font-size':13,'font-weight':700,'paint-order':'stroke',stroke:'#fff','stroke-width':3});text.textContent='P'+group[0].placeNumber;text.style.cursor='pointer';text.onclick=()=>select(group[0].id);}
 $('heightText').textContent=`Z ${Number($('height').value).toFixed(1)} ±0.75m`;setBox();
}
function showImages(prefix,p){for(const view of ['left','front','right'])$(prefix?prefix+view[0].toUpperCase()+view.slice(1):view).src=p.cameras[view]}
function select(id){selected=points.get(id);const place=places.get(selected.placeId);$('selected').textContent=place?`P${place.number} · ${place.id}`:'未知地点';$('meta').textContent=`${selected.time??'日期未知'} · 录像${selected.episode} ${selected.sourceAtMs/1000}秒 · 原生XYZ ${selected.xyz.map(n=>n.toFixed(2)).join(', ')}（不是认证楼层）`;showImages('',selected);$('reason').textContent='本次模型理由：'+selected.reason;$('summary').textContent=place?`模型初始摘要：${place.summary}\n${place.observations}个观察，录像${place.episodes.join(', ')}，XY包围范围对角${place.xyExtentM.toFixed(1)}m，原生Z ${place.nativeZRange.map(z=>z.toFixed(2)).join('—')}m。跨度大仅供复核。`:'';const record=records[selected.placeId]??{};$('status').value=record.status??'pending';$('notes').value=record.notes??'';$('save').disabled=!place;draw()}
function pair(a,b){comparison=points.get(b);$('compare').hidden=false;$('compareTitle').textContent=`对比 P${comparison.placeNumber??'?'} · 录像${comparison.episode}`;showImages('compare',comparison);$('compareMeta').textContent=`${comparison.time??''} · ${comparison.sourceAtMs/1000}秒 · ${comparison.reason}`;select(a)}
$('save').onclick=()=>{if(!selected?.placeId)return;records[selected.placeId]={status:$('status').value,notes:$('notes').value,updatedAt:new Date().toISOString()};try{localStorage.setItem(key,JSON.stringify(records));$('message').textContent='已本机保存；请导出备份。'}catch(e){$('message').textContent='本机保存失败：'+e.message}};
$('export').onclick=()=>{const value={protocol:'spatial-graph-review-notes-v1',fingerprint:data.fingerprint,records};const url=URL.createObjectURL(new Blob([JSON.stringify(value,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='school-spatial-graph-review.json';a.click();URL.revokeObjectURL(url)};
$('import').onchange=async e=>{try{const file=e.target.files[0];if(!file)return;const incoming=validateRecords(JSON.parse(await file.text()),data.fingerprint,new Set(places.keys()));if(!confirm('用导入记录替换此图的本机审核意见？'))return;localStorage.setItem(key,JSON.stringify(incoming));records=incoming;if(selected)select(selected.id);$('message').textContent='导入成功'}catch(error){$('message').textContent=error.message}};
for(const id of ['episode','height','heightEnabled'])$(id).onchange=draw;$('fit').onclick=()=>{box=[0,0,1000,700];draw()};$('zoomIn').onclick=()=>zoom(.7);$('zoomOut').onclick=()=>zoom(1.4);$('map').onwheel=e=>{e.preventDefault();zoom(e.deltaY<0?.85:1.15)};
$('map').onpointerdown=e=>{if(e.target.tagName==='circle'||e.target.tagName==='text')return;drag={x:e.clientX,y:e.clientY,box:[...box]};$('map').setPointerCapture(e.pointerId)};$('map').onpointermove=e=>{if(!drag)return;const rect=$('map').getBoundingClientRect();box=[drag.box[0]-(e.clientX-drag.x)*drag.box[2]/rect.width,drag.box[1]-(e.clientY-drag.y)*drag.box[3]/rect.height,drag.box[2],drag.box[3]];setBox()};$('map').onpointerup=()=>drag=null;
fetch('data.json').then(r=>{if(!r.ok)throw Error('审核数据加载失败');return r.json()}).then(value=>{data=value;key='spatial-graph-review:'+data.fingerprint;for(const p of data.samples)points.set(p.id,p);for(const p of data.places)places.set(p.id,p);$('title').textContent=data.title;$('warning').textContent=data.warning;$('stats').textContent=`${data.samples.length}组观察 · ${data.places.length}个地点 · ${data.edges.length}条转换记录 · ${data.suspicions.length}组几何复核候选`;
 const xs=data.samples.map(p=>p.xyz[0]),ys=data.samples.map(p=>p.xyz[1]),zs=data.samples.map(p=>p.xyz[2]);xy={minX:Math.min(...xs),minY:Math.min(...ys),scale:Math.min(930/Math.max(1,Math.max(...xs)-Math.min(...xs)),630/Math.max(1,Math.max(...ys)-Math.min(...ys)))};$('height').min=Math.floor(Math.min(...zs));$('height').max=Math.ceil(Math.max(...zs));$('height').value=zs[0];
 for(const episode of [...new Set(data.samples.map(p=>p.episode))]){const option=document.createElement('option');option.value=episode;option.textContent='录像'+episode;$('episode').append(option)}
 for(const place of data.places){const b=document.createElement('button');b.textContent=`P${place.number} · ${place.observations}观察 · 录像${place.episodes.join(',')} · XY跨度${place.xyExtentM.toFixed(1)}m`;b.style.borderLeft=`6px solid ${color(place.number)}`;b.onclick=()=>select(place.sampleIds[0]);$('places').append(b)}
 for(const item of data.suspicions){const b=document.createElement('button');b.textContent=`P${places.get(item.placeA).number} ↔ P${places.get(item.placeB).number} · ${item.distanceM}m · ${item.reason}`;b.onclick=()=>pair(item.a,item.b);$('pairs').append(b)}
 try{const old=localStorage.getItem(key);if(old)records=validateRecords({protocol:'spatial-graph-review-notes-v1',fingerprint:data.fingerprint,records:JSON.parse(old)},data.fingerprint,new Set(places.keys()))}catch(e){$('message').textContent='旧记录无法读取，未覆盖：'+e.message}select(data.samples[0].id);
}).catch(e=>$('message').textContent=e.message);
</script></html>
