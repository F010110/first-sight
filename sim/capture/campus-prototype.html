<!doctype html><html lang="zh"><meta charset="utf-8"><title>三摄校园原型 · 可漫游</title>
<style>body{margin:0;background:#111921;color:#eee;font:14px system-ui}header{padding:12px 20px}button{margin:4px;padding:7px}#views{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,3fr) minmax(0,1fr);gap:5px;align-items:center}canvas{width:100%;min-width:0;display:block}small{color:#adc3cc}</style>
<header><b>程序化校园原型 · 360×260米</b>　非真实校园／非UE资产／不用于模型评分<br><small>三摄同位置、朝向0°及±60°，独立渲染，90°水平视场。WASD移动，方向键转头；鼠标拖动画面转头。建筑入口可通行；没有楼层、人物及物理交互。</small><br>
<button onclick="preset('entrance')">校园道路</button><button onclick="preset('court')">中心庭院</button><button onclick="preset('inside')">教学楼室内</button><span id="position"></span></header><div id="views"></div>
<script type="module">
import * as T from './three.module.js';
const scene=new T.Scene();scene.background=new T.Color('#b6d7ed');scene.fog=new T.Fog('#b6d7ed',140,480);
scene.add(new T.HemisphereLight(0xddeeff,0x6c7358,2.2));const sun=new T.DirectionalLight(0xffedce,2.6);sun.position.set(-80,130,40);scene.add(sun);
const mats={};function mat(c){return mats[c]??(mats[c]=new T.MeshStandardMaterial({color:c,roughness:.85}));}
const obstacles=[];
function box(x,y,z,w,h,d,c,solid=false){const m=new T.Mesh(new T.BoxGeometry(w,h,d),mat(c));m.position.set(x,y,z);scene.add(m);if(solid)obstacles.push({x,z,w:w/2+.25,d:d/2+.25});return m;}
box(0,-.2,0,360,.4,260,'#718a55');box(0,.015,0,12,.04,250,'#717979');box(0,.02,0,350,.04,10,'#717979');
for(let z=-110;z<120;z+=10)box(0,.05,z,.18,.02,4,'#ece6c6');
for(const x of [-25,25])box(x,.04,0,4,.06,220,'#cecab7');
box(0,.04,-34,100,.06,34,'#ccc6af');
function label(text,x,y,z){const c=document.createElement('canvas');c.width=512;c.height=96;const ctx=c.getContext('2d');ctx.fillStyle='#243b46';ctx.fillRect(0,0,512,96);ctx.fillStyle='white';ctx.font='bold 42px sans-serif';ctx.textAlign='center';ctx.fillText(text,256,64);const m=new T.Mesh(new T.PlaneGeometry(10,1.875),new T.MeshBasicMaterial({map:new T.CanvasTexture(c),side:T.DoubleSide}));m.position.set(x,y,z);scene.add(m);}
function building(x,z,w,d,color,name){
 const h=7;
 box(x,0.07,z,w,.14,d,'#d7cbb4');box(x,h,z,w+.6,.35,d+.6,'#646d75');
 // Continuous side/back walls; front wall has a real four-metre opening.
 box(x-w/2,h/2,z,.35,h,d,color,true);box(x+w/2,h/2,z,.35,h,d,color,true);box(x,h/2,z-d/2,w,h,.35,color,true);
 for(const s of [-1,1])box(x+s*(w/4+1),h/2,z+d/2,w/2-2,h,.35,color,true);
 box(x,6,z+d/2,4,2,.35,color,true);
 for(let dx=-w/2+3;dx<w/2;dx+=5){if(Math.abs(dx)>3){box(x+dx,3.6,z+d/2+.21,2.6,2,.06,'#84b1c1');box(x+dx,1.6,z+d/2+.25,2.9,.15,.18,'#e7e0cf');}}
 label(name,x,5.9,z+d/2+.3);
 for(let dz=-d/2+5;dz<d/2-4;dz+=5)for(const dx of [-w/4,w/4]){box(x+dx, .8,z+dz,3, .14,1.4,'#aa8057',true);for(const s of [-1,1]){box(x+dx+s, .4,z+dz,.12,.8,.9,'#626c74');box(x+dx+s,.48,z+dz+1.3,.8,.12,.8,'#587684',true);}}
 for(let dx=-w/2+2;dx<w/2;dx+=6)box(x+dx,h-.25,z,2.5,.06,.8,'#fff4d6');
}
building(-51,-65,38,32,'#b9b0a0','SCIENCE A');building(51,-65,38,32,'#bb9d82','LIBRARY');
building(-76,38,44,30,'#c0ab8c','DINING');building(72,40,40,34,'#a5b1b1','STUDENT CENTER');
building(-115,-65,32,30,'#b3aaa0','SCIENCE B');building(116,-64,34,32,'#c6b392','ARTS');
building(-115,93,36,26,'#baaa98','RESIDENCE A');building(115,94,36,26,'#b7aca0','RESIDENCE B');
for(const [x,z] of [[-51,-31],[51,-31],[-76,68],[72,70],[-115,-32],[116,-30],[-115,115],[115,116]]){box(x,.025,z,4,.04,20,'#cfc8b7');}
const trunk=new T.CylinderGeometry(.25,.4,4,7),crown=new T.IcosahedronGeometry(2.7,1);
function tree(x,z){const a=new T.Mesh(trunk,mat('#76604a'));a.position.set(x,2,z);scene.add(a);const b=new T.Mesh(crown,mat('#446b42'));b.position.set(x,5,z);scene.add(b);obstacles.push({x,z,w:.6,d:.6});}
for(let z=-110;z<=110;z+=14)for(const x of [-17,17])tree(x,z);
for(let x=-155;x<=155;x+=18){tree(x,-113);tree(x,124);}
for(const x of [-36,36])for(const z of [-20,0,20]){box(x,.5,z,4,.25,1,'#95714f',true);box(x,.22,z,3,.4,.6,'#646b6c');}
const fountain=new T.Mesh(new T.CylinderGeometry(5,5,.65,48),mat('#9badae'));fountain.position.set(0,.35,-34);scene.add(fountain);const water=new T.Mesh(new T.CircleGeometry(4.5,48),new T.MeshStandardMaterial({color:'#559cac',roughness:.2}));water.rotation.x=-Math.PI/2;water.position.set(0,.69,-34);scene.add(water);obstacles.push({x:0,z:-34,w:5,d:5});
const views=document.querySelector('#views'),renderers=[],cameras=[];
for(const offset of [Math.PI/3,0,-Math.PI/3]){const r=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});r.setSize(800,600);r.setPixelRatio(1);r.outputColorSpace=T.SRGBColorSpace;r.toneMapping=T.ACESFilmicToneMapping;views.append(r.domElement);renderers.push(r);const c=new T.PerspectiveCamera(73.7398,4/3,.1,600);c.userData.offset=offset;cameras.push(c);}
let x=0,z=75,yaw=0;const keys=new Set();window.onkeydown=e=>{keys.add(e.key.toLowerCase());if(e.key.startsWith('Arrow'))e.preventDefault();};window.onkeyup=e=>keys.delete(e.key.toLowerCase());let drag=false;window.onpointerdown=()=>drag=true;window.onpointerup=()=>drag=false;window.onpointermove=e=>{if(drag)yaw-=e.movementX*.005;};
window.preset=name=>{[x,z,yaw]=name==='inside'?[-51,-57,0]:name==='court'?[24,-15,.7]:[0,75,0];draw();};
function draw(){for(let i=0;i<3;i++){const c=cameras[i];c.position.set(x,1.65,z);c.rotation.set(0,yaw+c.userData.offset,0);renderers[i].render(scene,c);}document.querySelector('#position').textContent=` x=${x.toFixed(1)} z=${z.toFixed(1)} m`;}
let last=performance.now();function tick(now){const dt=Math.min((now-last)/1000,.05);last=now;if(keys.has('arrowleft'))yaw+=dt;if(keys.has('arrowright'))yaw-=dt;let f=Number(keys.has('w'))-Number(keys.has('s')),s=Number(keys.has('d'))-Number(keys.has('a'));const v=dt*5;const nx=x+(-Math.sin(yaw)*f+Math.cos(yaw)*s)*v,nz=z+(-Math.cos(yaw)*f-Math.sin(yaw)*s)*v;if(Math.abs(nx)<178&&Math.abs(nz)<128&&!obstacles.some(o=>Math.abs(nx-o.x)<o.w&&Math.abs(nz-o.z)<o.d)){x=nx;z=nz;}draw();requestAnimationFrame(tick);}requestAnimationFrame(tick);window.sampleReady=true;
</script></html>
