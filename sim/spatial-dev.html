<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>模拟器 · 空间记忆开发台</title>
<style>body{font:15px system-ui;background:#111827;color:#e5e7eb;margin:24px}button,select,input{padding:8px;margin:4px;background:#263449;color:inherit;border:1px solid #64748b;border-radius:5px}section{padding:16px;background:#1e293b;margin-top:12px;border-radius:8px}.cameras{display:flex;gap:8px}.cameras figure{margin:0;width:33%}img{width:100%;min-height:100px;object-fit:contain}pre{white-space:pre-wrap;overflow:auto;max-height:440px;font-size:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}h1{font-size:24px}small{color:#cbd5e1}.error{color:#fca5a5}</style>
<h1>模拟器 · 长期空间记忆开发台</h1><small>仅本机开发，不接实际产品。无语音／聊天。历史图不代表当前状态，转移边不代表可通行。真值不进入Agent。</small>
<section><button id="refresh">刷新</button><select id="session"><option value="">全部录制</option></select><select id="observation"></select><button id="step">入队下一观察</button><label><input id="paid" type="checkbox">允许本次付费模型调用</label><button id="recognize">处理最早4观察</button><pre id="status"></pre></section>
<section class="cameras"><figure><figcaption>前</figcaption><img id="cam0"></figure><figure><figcaption>左</figcaption><img id="cam1"></figure><figure><figcaption>右</figcaption><img id="cam2"></figure></section>
<section><label>记忆节点 <select id="place"><option value="">未知／未选择</option></select></label><button id="placeInfo">访问／转移证据</button><button id="retrieve">恢复此地点历史</button><button id="retrieveAll">历史第一页</button><button id="more">恢复下一页</button><select id="task"><option value="revisit">重访证据任务</option><option value="difference">历史差异任务</option></select><button id="request">RequestAgent</button><button id="change">场景变化Agent</button><button id="confirm">确认地点</button><button id="undo">撤回上次修订</button><p id="error" class="error"></p></section>
<div class="grid"><section><h2>节点／观察归属</h2><button id="graphMore">下一页归属</button><pre id="graph"></pre></section><section><h2>检索证据／Agent结果</h2><pre id="result">等待操作</pre></section></div>
<section><h2>历史原图证据（非当前画面）</h2><div id="evidence" class="cameras"></div></section>
<section><strong>人工修订（仅测试库）</strong><label>合并目标 <select id="target"></select></label><button id="merge">源地点并入目标</button><button id="split">将所选观察拆为候选地点</button><small>源地点为上方记忆节点；理由固定记录为developer review，拆分摘要自动生成。原观察保留。</small></section>
<script>
const token='__TOKEN__';let observations=[],cursor=0,graphCursor=0,lastRevision=null;const $=id=>document.getElementById(id);
async function command(action,extra={}){ $('error').textContent='';try{const r=await fetch('/command',{method:'POST',headers:{'Content-Type':'application/json','X-Dev-Token':token},body:JSON.stringify({action,id:$('observation').value,placeId:$('place').value,task:$('task').value,confirmPaid:$('paid').checked,...extra})});const value=await r.json();if(!r.ok)throw Error(value.error);return value;}catch(e){$('error').textContent=e.message;throw e;}}
function images(){for(let i=0;i<3;i++)$('cam'+i).src='/image?id='+encodeURIComponent($('observation').value)+'&camera='+i;cursor=0;}
function filter(){const previous=$('observation').value;$('observation').replaceChildren(...observations.filter(r=>!$('session').value||r.sessionId===$('session').value).map(r=>new Option(`${r.ingested?'●':'○'} ${r.id} @${r.atMs}`,r.id)));if([...$('observation').options].some(o=>o.value===previous))$('observation').value=previous;images();}
async function refresh(){const s=await command('status');observations=s.observations;$('status').textContent=JSON.stringify(s.status,null,2);const selected=$('session').value;$('session').replaceChildren(new Option('全部录制',''),...[...new Set(observations.map(r=>r.sessionId))].map(id=>new Option(id,id)));$('session').value=selected;filter();const place=$('place').value;$('place').replaceChildren(new Option('未知／未选择',''),...s.nodes.map(n=>new Option(n.summary+' ['+n.id.slice(0,8)+']',n.id)));$('place').value=place;$('target').replaceChildren(...s.nodes.map(n=>new Option(n.summary+' ['+n.id.slice(0,8)+']',n.id)));$('graph').textContent=JSON.stringify({nodes:s.nodes,observations:s.graph},null,2);graphCursor=s.graph.nextCursor;}
async function result(action,extra={}){const r=await command(action,extra);$('result').textContent=JSON.stringify(r,null,2);if(action==='retrieve'){cursor=r.nextCursor;$('evidence').replaceChildren(...r.hits.map(hit=>{const figure=document.createElement('figure'),caption=document.createElement('figcaption'),img=document.createElement('img');caption.textContent=hit.id+' @'+hit.atMs;img.src='/image?id='+encodeURIComponent(hit.id)+'&camera=0';figure.append(caption,img);return figure;}));}return r;}
function click(id,fn){$(id).onclick=()=>Promise.resolve().then(fn).catch(()=>{});}
click('refresh',refresh);$('session').onchange=filter;$('observation').onchange=images;
click('step',async()=>{await result('step');await refresh();});click('recognize',async()=>{await result('recognize');await refresh();});
click('retrieve',()=>result('retrieve',{cursor:0}));click('retrieveAll',()=>result('retrieve',{placeId:undefined,cursor:0}));click('more',()=>cursor!==null?result('retrieve',{cursor}):null);
click('request',()=>result('request'));click('change',()=>result('change'));click('confirm',async()=>{lastRevision=await result('revise',{kind:'confirm'});await refresh();});click('undo',async()=>{await result('undo',{revisionId:lastRevision});await refresh();});
click('placeInfo',()=>result('place'));
click('merge',async()=>{lastRevision=await result('revise',{kind:'merge',targetId:$('target').value});await refresh();});click('split',async()=>{lastRevision=await result('revise',{kind:'split',summary:'developer split '+$('observation').value});await refresh();});
click('graphMore',async()=>{const s=await command('status',{cursor:graphCursor});$('graph').textContent=JSON.stringify(s.graph,null,2);graphCursor=s.graph.nextCursor;});refresh().catch(()=>{});
</script></html>
