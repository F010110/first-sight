<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>学校空间记忆审核</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101827;color:#e5edf9;font:14px system-ui}a{color:#9dc9ff}header{padding:18px 24px;border-bottom:1px solid #35445c}h1{font-size:23px;margin:8px 0}h2{font-size:18px}h3{font-size:15px}.muted{color:#a8b8cd}button,input,select,textarea{font:inherit;color:inherit;background:#203149;border:1px solid #526680;border-radius:6px;padding:8px}button{cursor:pointer}button:disabled{opacity:.45;cursor:default}button:focus-visible,a:focus-visible{outline:2px solid #8ddbd8}.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}.layout{display:grid;grid-template-columns:290px minmax(0,1fr);gap:18px;padding:18px 24px}aside{align-self:start;position:sticky;top:12px;max-height:90vh;overflow:auto}.issue{width:100%;text-align:left;display:block;margin:8px 0;padding:12px}.issue[aria-current=true]{border-color:#7edbd4;background:#244847}.badge{font-size:12px;color:#b7e0de}.panel{background:#172338;border:1px solid #384961;border-radius:10px;padding:16px;margin-bottom:14px}.columns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.views{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.views img{width:100%;display:block;border-radius:4px}figure{margin:0}figcaption{padding:6px;color:#adbed5}.value{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6}textarea{display:block;width:100%;min-height:100px}label{display:inline-block;margin:5px 0}#gallery{max-height:65vh;overflow:auto}#gallery .panel{padding:10px}.danger{color:#ffc6a0}#message{min-height:22px}details{margin:12px 0}summary{cursor:pointer}#empty{padding:12px}input[type=range]{width:min(420px,90%)}@media(max-width:850px){.layout{grid-template-columns:1fr}aside{position:static;max-height:280px}.columns{grid-template-columns:1fr}.views{grid-template-columns:1fr}header,.layout{padding:12px}}
</style>
<header><a href="../">返回全部样本</a><h1>学校空间记忆 · 残余问题审核</h1><p id="warning" class="muted"></p>
<div class="tools"><span id="counts"></span><button id="export">导出审核JSON</button><label>导入审核JSON <input id="import" type="file" accept="application/json"></label></div><div id="message" role="status" aria-live="polite"></div></header>
<div class="layout"><aside><div class="tools"><input id="search" aria-label="搜索问题" placeholder="问题、编号、类别"><select id="difficulty" aria-label="难度"><option value="">全部难度</option value="easy">易修复</option><option value="human">需人工复核</option><option value="hard">困难／证据链</option></select><select id="filterStatus" aria-label="审核状态筛选"><option value="">全部状态</option><option value="pending">待审核</option><option value="reviewing">审核中</option><option value="confirmed">已确认问题</option><option value="disputed">标签／证据有争议</option></select></div><nav id="issues" aria-label="问题列表"></nav><p id="empty" hidden>无匹配问题</p></aside>
<main><section class="panel"><div class="tools"><button id="previous">上一题</button><button id="next">下一题</button><span id="position"></span></div><h2 id="question"></h2><div id="meta" class="muted"></div><p id="diagnosis" class="value"></p><div class="columns"><div><h3>系统原回答（只读）</h3><p id="answer" class="value"></p></div><div><h3>冻结参考（AI标注，非最终真值）</h3><p id="reference" class="value"></p></div></div><details><summary>原判分依据／引用来源</summary><p id="grade" class="value"></p><p id="citations" class="value"></p></details>
<label>人工审核状态 <select id="status"><option value="pending">待审核</option><option value="reviewing">审核中</option><option value="confirmed">已确认问题</option><option value="disputed">标签／证据有争议</option></select></label><label>建议归因 <select id="cause"><option value="">未定</option><option value="protocol">协议／拒答标志</option><option value="retrieval">检索控制／工具接口</option><option value="visual">视觉判断／用途猜测</option><option value="label">参考标签边界</option><option value="evidence">证据不足</option><option value="spatial">空间记忆关联</option></select></label><label for="notes">审核意见（不会直接更改冻结标签）</label><textarea id="notes" placeholder="描述可见事实、支持或反对哪个判断；不要只写结论"></textarea><div class="tools"><button id="save">保存本机审核意见</button><span id="saved" class="muted"></span></div></section>
<section class="panel"><h2>当前图与参考证据</h2><p class="muted">当前、参考和模型实际查看分别标记；参考图不等于模型确实取到。点击原图可放大。</p><div id="evidence"></div></section>
<section class="panel"><h2>全样本录像观察序列</h2><p class="muted">851组三视角原图，按源段内时间查看；不是合成连续视频。跨段间隔不可推断路线。楼层题请审核第8段26–80秒的连续观察。</p><div class="tools"><select id="episode" aria-label="录像段"></select><button id="context">跳到本题历史上下文</button><input id="timeline" type="range" min="0" max="0" value="0" aria-label="段内观察时间"><span id="time"></span></div><div id="gallery"></div></section></main></div>
<script>
'use strict';
const $=id=>document.getElementById(id), names={easy:'易修复',human:'需人工复核',hard:'困难／证据链'}, statuses={pending:'待审核',reviewing:'审核中',confirmed:'已确认问题',disputed:'标签／证据有争议'};
let data,records={},selected,storageKey,dirty=false;const sampleMap=new Map();
function message(text,error=false){$('message').textContent=text;$('message').className=error?'danger':''}
function persist(){try{localStorage.setItem(storageKey,JSON.stringify(records));return true}catch(e){message('本机保存失败，请导出备份：'+e.message,true);return false}}
function filtered(){const query=$('search').value.trim().toLowerCase();return data.issues.filter(i=>(!$('difficulty').value||i.difficulty===$('difficulty').value)&&(!$('filterStatus').value||(records[i.id]?.status||'pending')===$('filterStatus').value)&&(!query||[i.id,i.question,i.category].join(' ').toLowerCase().includes(query)))}
function list(){const issues=filtered();$('issues').replaceChildren();for(const issue of issues){const b=document.createElement('button');b.className='issue';b.setAttribute('aria-current',String(issue.id===selected));b.textContent=`${names[issue.difficulty]} · ${statuses[records[issue.id]?.status||'pending']}\n${issue.question}\n${issue.id.slice(-8)}`;b.onclick=()=>choose(issue.id);$('issues').append(b)}$('empty').hidden=issues.length>0;const done=Object.values(records).filter(r=>['confirmed','disputed'].includes(r.status)).length;$('counts').textContent=`8个问题 · 已审核${done} · 显示${issues.length}`;const pos=issues.findIndex(i=>i.id===selected);$('previous').disabled=pos<=0;$('next').disabled=pos<0||pos>=issues.length-1;$('position').textContent=pos>=0?`${pos+1} / ${issues.length}`:'当前题不在筛选结果中'}
function sampleCard(sample,tags=''){const article=document.createElement('article');article.className='panel';const title=document.createElement('h3');title.textContent=`第${sample.episode}段 ${sample.sourceAtMs/1000}秒 · ${tags}`;const id=document.createElement('p');id.className='muted';id.textContent=sample.id;article.append(title,id);const views=document.createElement('div');views.className='views';for(const camera of ['front','left','right']){const f=document.createElement('figure'),a=document.createElement('a'),img=document.createElement('img'),caption=document.createElement('figcaption');a.href=sample.cameras[camera];a.target='_blank';a.rel='noopener';img.src=sample.cameras[camera];img.alt=`第${sample.episode}段${sample.sourceAtMs/1000}秒 ${camera}原图`;img.loading='lazy';caption.textContent=camera;a.append(img);f.append(a,caption);views.append(f)}article.append(views);return article}
function choose(id){if(dirty&&!confirm('当前修改未保存，放弃修改并切换？'))return;selected=id;dirty=false;const issue=data.issues.find(i=>i.id===id);$('question').textContent=issue.question;$('meta').textContent=`${issue.id} · ${names[issue.difficulty]} · ${issue.category} · 原效用${issue.utility}`;$('diagnosis').textContent=issue.diagnosis;$('answer').textContent=issue.answer||issue.error||'无答案';$('reference').textContent=issue.reference;$('grade').textContent=`${issue.gradeReason||''}\n标注依据：${issue.labelBasis}`;$('citations').textContent=`实际查看：${issue.inspectedIds.join(', ')}\n原回答引用：${issue.citationIds.join(', ')}\n拒答标志：${issue.abstained??'无'}`;const record=records[id]||{};$('status').value=record.status||'pending';$('cause').value=record.cause||'';$('notes').value=record.notes||'';$('saved').textContent=record.updatedAt?'本机保存于 '+record.updatedAt:'';$('evidence').replaceChildren();for(const sid of [...new Set([issue.currentId,...issue.referenceIds])]){const sample=sampleMap.get(sid);if(sample)$('evidence').append(sampleCard(sample,[sid===issue.currentId?'当前图':'历史参考',issue.inspectedIds.includes(sid)?'模型已查看':'模型未查看',issue.citationIds.includes(sid)?'已引用':'未引用'].join(' · ')))}list();context()}
function episodeRows(){return data.samples.filter(s=>s.episode===Number($('episode').value))}
function timeline(){const rows=episodeRows(),index=Number($('timeline').value);$('gallery').replaceChildren();const current=rows[index];$('time').textContent=current?`${index+1}/${rows.length} · ${current.sourceAtMs/1000}秒`:'';for(const s of rows.slice(Math.max(0,index-1),index+2))$('gallery').append(sampleCard(s,s.id===current?.id?'选中观察':'邻近观察'))}
function context(){const issue=data.issues.find(i=>i.id===selected);const sample=sampleMap.get(issue.referenceIds.find(id=>id!==issue.currentId)||issue.currentId);if(!sample)return;$('episode').value=sample.episode;const rows=episodeRows();$('timeline').max=Math.max(0,rows.length-1);$('timeline').value=rows.findIndex(s=>s.id===sample.id);timeline()}
for(const id of ['status','cause','notes'])$(id).addEventListener('input',()=>{dirty=true;$('saved').textContent='尚未保存'});
$('save').onclick=()=>{const previous=records[selected];records[selected]={status:$('status').value,cause:$('cause').value,notes:$('notes').value,updatedAt:new Date().toISOString()};if(persist()){dirty=false;$('saved').textContent='已保存到当前浏览器；请导出备份';list();message('保存成功，不会修改冻结数据')}else{if(previous)records[selected]=previous;else delete records[selected]}};
for(const id of ['search','difficulty','filterStatus'])$(id).addEventListener('input',list);
for(const [id,delta] of [['previous',-1],['next',1]])$(id).onclick=()=>{const rows=filtered(),pos=rows.findIndex(r=>r.id===selected),target=rows[pos+delta];if(target)choose(target.id)};
$('episode').onchange=()=>{$('timeline').max=Math.max(0,episodeRows().length-1);$('timeline').value=0;timeline()};$('timeline').oninput=timeline;$('context').onclick=context;
$('export').onclick=()=>{if(dirty&&!confirm('未保存修改不会导出，仍然继续？'))return;const blob=new Blob([JSON.stringify({protocol:'school-human-review-v1',datasetId:data.datasetId,fingerprint:data.fingerprint,exportedAt:new Date().toISOString(),records},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='school-memory-human-review.json';a.click();URL.revokeObjectURL(url)};
function validateImport(doc){if(doc.protocol!=='school-human-review-v1'||doc.datasetId!==data.datasetId||doc.fingerprint!==data.fingerprint||!doc.records||typeof doc.records!=='object'||Array.isArray(doc.records))throw Error('样本或版本不匹配');const allowedCauses=['','protocol','retrieval','visual','label','evidence','spatial'];for(const [id,r] of Object.entries(doc.records)){if(!data.issues.some(i=>i.id===id)||!r||!Object.hasOwn(statuses,r.status)||!allowedCauses.includes(r.cause)||typeof r.notes!=='string'||r.notes.length>20000||typeof r.updatedAt!=='string'||!Number.isFinite(Date.parse(r.updatedAt)))throw Error('非法审核记录：'+id)}return doc.records}
$('import').onchange=async event=>{try{const file=event.target.files[0];if(!file)return;if(file.size>2e6)throw Error('文件超过2MB');const incoming=validateImport(JSON.parse(await file.text()));if(!confirm('导入将合并审核意见，同题以较新保存时间为准。继续？'))return;const before=records;records={...records};for(const [id,r] of Object.entries(incoming))if(!records[id]||Date.parse(r.updatedAt)>Date.parse(records[id].updatedAt))records[id]=r;if(!persist()){records=before;return}dirty=false;choose(selected);message('导入成功；未修改冻结标签')}catch(e){message('导入失败：'+e.message,true)}finally{event.target.value=''}};
window.addEventListener('beforeunload',event=>{if(dirty){event.preventDefault();event.returnValue=''}});
fetch('data.json').then(r=>{if(!r.ok)throw Error('数据加载失败');return r.json()}).then(value=>{data=value;storageKey=`school-human-review-v1:${data.fingerprint}`;for(const s of data.samples)sampleMap.set(s.id,s);try{const stored=localStorage.getItem(storageKey);if(stored)records=validateImport({protocol:'school-human-review-v1',datasetId:data.datasetId,fingerprint:data.fingerprint,records:JSON.parse(stored)})}catch(e){message('本机记录无法读取；未覆盖旧记录：'+e.message,true)}$('warning').textContent=data.warning;for(const episode of [...new Set(data.samples.map(s=>s.episode))]){const option=document.createElement('option');option.value=episode;option.textContent=`第${episode}段`;$('episode').append(option)}choose(data.issues[0].id)}).catch(e=>message(e.message,true));
</script></html>
