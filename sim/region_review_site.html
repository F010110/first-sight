<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>空间样本审核</title>
<style>body{margin:0;background:#101827;color:#e8edf7;font:15px system-ui}main{padding:12px}h1{font-size:20px;margin:0}button,input,textarea,select{font:inherit;padding:8px;border-radius:5px}button{cursor:pointer}header{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.layout{display:grid;grid-template-columns:minmax(0,3fr) minmax(280px,1fr);gap:12px;margin-top:10px;height:calc(100dvh - 100px)}.media,.side{min-height:0;overflow:auto;background:#202b40;padding:10px;border-radius:8px}video{width:100%;max-height:48vh;background:black}img{width:100%;max-height:22vh;object-fit:contain}#timeline{width:95%}.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}#list{overflow:auto;flex:1;min-height:80px}#list button{display:block;width:100%;text-align:left;margin:3px 0}.side{display:flex;flex-direction:column;gap:8px}textarea{box-sizing:border-box;width:100%;height:65px}pre{white-space:pre-wrap;margin:4px 0}.active{outline:2px solid #48bcff}#pass{background:#8de5bb}#fail{background:#ffc0b8}.muted{color:#b2bed2;font-size:12px}details{max-height:140px;overflow:auto}@media(max-width:700px){.layout{grid-template-columns:1fr;height:auto}.side{position:sticky;bottom:0}video{max-height:35vh}#list{max-height:120px}}</style>
<main><header><h1>空间样本审核</h1><span id="summary"></span><button id="export">导出审核</button></header><p class="muted">左／前／右以暗色缝隙分隔。24fps重复原帧，无淡化；原素材2帧/秒，不代表新增转动细节。审核针对当前算法预测，AI审查标签仅作参考。</p>
<div class="layout"><section class="media"><video id="video" src="motion-hold.mp4" controls muted playsinline></video><input id="timeline" type="range" min="0" step="1"><div class="row"><button id="prevFrame">上一帧</button><button id="nextFrame">下一帧</button><select id="speed"><option>.5</option><option selected>1</option><option>2</option></select><span id="clock"></span></div><h3 id="sampleTitle"></h3><img id="still" alt="原时刻三视图"><details><summary>原AI审查及模型依据</summary><pre id="aiLabel"></pre><pre id="reason"></pre></details></section>
<aside class="side"><strong id="prediction"></strong><div class="row"><button id="prev">上一点</button><button id="next">下一点</button></div><textarea id="note" placeholder="不通过的理由（必填）"></textarea><div class="row"><button id="pass">通过</button><button id="fail">不通过</button></div><span id="feedback" aria-live="polite"></span><input id="filter" placeholder="搜索样本／区域"><div id="list"></div><span class="muted">点击即保存；请导出备份。原数据不覆盖。</span></aside></div></main>
<script>
(async()=>{const d=await fetch('data.json').then(r=>{if(!r.ok)throw Error('数据加载失败');return r.json()});const $=id=>document.getElementById(id),v=$('video');let selected=0;const key='region-review:'+d.reportSha256+':'+d.datasetId;let reviews={};try{reviews=JSON.parse(localStorage.getItem(key)||'{}')}catch{}$('summary').textContent=`${d.datasetId} · ${d.samples.length}个样本`+(d.protocolWarning?' · 存在协议隔离未知组':'');$('timeline').max=d.frameCount-1;
function label(s){return s.boundary?'边界组/观察':s.prediction||'未定'}
function status(r){return r?.decision==='pass'?'通过':r?.decision==='fail'?'不通过':r?'旧审核（保留）':'未审核'}
function choose(i,seek=true){selected=Math.max(0,Math.min(d.samples.length-1,i));const s=d.samples[selected];$('sampleTitle').textContent=`${s.id} · 原帧${s.tick}`;$('still').src=s.image;$('prediction').textContent='算法预测：'+label(s);$('aiLabel').textContent='已有AI审查（非真值）：'+JSON.stringify(s.aiReview||'无');const idx=Number((s.prediction||'').split('-').at(-1));$('reason').textContent=JSON.stringify(s.boundary||d.regionReasons[idx-1]||{},null,2);$('note').value=reviews[s.id]?.note||'';$('feedback').textContent=status(reviews[s.id]);if(seek){v.pause();v.currentTime=(s.tick+.05)/d.fps}render()}
function render(){const f=$('filter').value.toLowerCase();$('list').replaceChildren();d.samples.forEach((s,i)=>{if(!`${s.id} ${label(s)}`.toLowerCase().includes(f))return;const b=document.createElement('button');b.textContent=`${s.id.replace('observation-','#')} · ${label(s)} · ${status(reviews[s.id])}`;b.className=i===selected?'active':'';b.onclick=()=>choose(i);$('list').append(b)})}
v.ontimeupdate=()=>{const tick=Math.min(d.frameCount-1,Math.floor(v.currentTime*d.fps));$('timeline').value=tick;$('clock').textContent=`原帧${tick}`;const i=d.samples.findLastIndex(s=>s.tick<=tick);if(i>=0&&i!==selected)choose(i,false)};$('timeline').oninput=e=>{v.pause();v.currentTime=(Number(e.target.value)+.05)/d.fps};for(const [id,delta] of [['prevFrame',-1],['nextFrame',1]])$(id).onclick=()=>{v.pause();v.currentTime=(Math.max(0,Math.min(d.frameCount-1,Math.floor(v.currentTime*d.fps)+delta))+.05)/d.fps};$('prev').onclick=()=>choose(selected-1);$('next').onclick=()=>choose(selected+1);$('speed').onchange=e=>v.playbackRate=Number(e.target.value);$('filter').oninput=render;$('note').oninput=()=>v.pause();
function save(decision){v.pause();const note=$('note').value.trim();if(decision==='fail'&&!note){$('feedback').textContent='请填写不通过的理由';$('note').focus();return}const s=d.samples[selected];reviews[s.id]={...(reviews[s.id]||{}),decision,note,reviewTarget:'algorithmPrediction',prediction:s.prediction,boundary:s.boundary||null,reviewedAt:new Date().toISOString()};try{localStorage.setItem(key,JSON.stringify(reviews));$('feedback').textContent=status(reviews[s.id])+'，已保存'}catch{$('feedback').textContent='存储失败，请立即导出'}render()}
$('pass').onclick=()=>save('pass');$('fail').onclick=()=>save('fail');$('export').onclick=()=>{const result={protocol:'human-region-approval-v2',datasetId:d.datasetId,reportSha256:d.reportSha256,blind:false,assistedByAI:true,exportedAt:new Date().toISOString(),labels:d.samples.map(s=>({observationId:s.id,tick:s.tick,imageSha256:s.imageSha256,...(reviews[s.id]||{decision:'unreviewed'})}))};const url=URL.createObjectURL(new Blob([JSON.stringify(result,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download=d.datasetId+'-human-review.json';a.click();URL.revokeObjectURL(url)};choose(0,false)
})().catch(e=>{document.getElementById('summary').textContent=e.message});
</script></html>
