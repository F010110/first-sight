<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>空间样本人工审查</title>
<style>body{margin:0;background:#101827;color:#e8edf7;font:16px system-ui}main{max-width:1300px;margin:auto;padding:20px}video,img{width:100%;background:#000}button,input,select,textarea{font:inherit;padding:7px;margin:4px}button{cursor:pointer}section{background:#202b40;padding:15px;margin:12px 0;border-radius:8px}.grid{display:grid;grid-template-columns:2fr 1fr;gap:16px}#list{max-height:700px;overflow:auto}#list button{display:block;width:96%;text-align:left}#list button.active{outline:3px solid #48bcff}pre{white-space:pre-wrap;overflow-wrap:anywhere}#timeline{width:100%}.muted{color:#b2bed2}.boundary{color:#ffc65b}.correct{color:#8de5bb}textarea{width:90%}@media(max-width:800px){.grid{grid-template-columns:1fr}}.markers{display:flex;flex-wrap:wrap;gap:2px}.markers button{font-size:12px;padding:3px}</style></head>
<body><main><h1>连续运动与区域样本审查</h1><p class="muted">前／左／右模拟视图。播放速度为展示设置，不是真实步速。模型预测与AI审查标签不是人工真值；这里是辅助审查，不是盲审。</p><div id="summary"></div>
<div class="grid"><div><section><video id="video" src="motion.mp4" controls muted playsinline></video><input id="timeline" type="range" min="0" step="1"><div id="clock"></div><button id="prevFrame">上一帧</button><button id="nextFrame">下一帧</button><select id="speed"><option>.25</option><option>.5</option><option selected>1</option><option>2</option></select><div class="markers" id="markers"></div></section>
<section><h2 id="sampleTitle">样本点</h2><img id="still" alt="样本原始三视图"><p id="prediction"></p><pre id="aiLabel"></pre><details><summary>模型依据</summary><pre id="reason"></pre></details></section>
<section><h2>人工审查（独立导出）</h2><label>审查者<input id="reviewer" placeholder="填写姓名或标识"></label><br><select id="kind"><option value="unreviewed">未审核</option><option value="core">明确区域</option><option value="boundary">边界／过渡</option><option value="unknown">证据不足</option></select><input id="region" placeholder="人工区域身份，例如 living-A"><input id="neighbors" placeholder="边界邻接身份，逗号分隔"><textarea id="note" placeholder="依据／修改原因"></textarea><br><button id="save">保存此点</button><button id="export">导出全部人工审查JSON</button><span id="feedback" aria-live="polite"></span><p class="muted">同一区域请使用相同身份，两个卧室不能只用“卧室”混同。先确认粒度；边界不强迫归稳定区域。原AI数据不会被覆盖，浏览器保存以此数据包hash隔离。</p></section></div><section><h2>全部查询样本</h2><input id="filter" placeholder="搜索编号／区域／边界"><div id="list"></div></section></div></main>
<script>
(async()=>{const d=await fetch('data.json').then(r=>{if(!r.ok)throw Error('data.json加载失败');return r.json()});const $=id=>document.getElementById(id),v=$('video');let selected=0;const key='region-review:'+d.reportSha256+':'+d.datasetId;let reviews={};try{reviews=JSON.parse(localStorage.getItem(key)||'{}')}catch{}$('summary').textContent=`数据集 ${d.datasetId} · 模型 ${d.model} · ${d.samples.length} 个样本 · ${d.frameCount} 帧`+(d.protocolWarning?` · 原回答协议缺陷：${d.protocolWarning}，${d.quarantinedGroups.length}组已隔离为未定`:''); $('timeline').max=d.frameCount-1;for(const id of ['kind','region','neighbors','note'])$(id).addEventListener('input',()=>v.pause());
function label(s){return s.boundary?'边界组/观察':s.prediction||'未定'}
function choose(i,seek=true){selected=i;const s=d.samples[i];$('sampleTitle').textContent=`${s.id} · 原帧 ${s.tick} · 视频 ${(s.tick/d.fps).toFixed(1)}秒`;$('still').src=s.image;$('prediction').textContent='算法预测：'+label(s);$('prediction').className=s.boundary?'boundary':'correct';$('aiLabel').textContent='已有AI审查（非真值）：'+(s.aiReview?JSON.stringify({kind:s.aiReview.kind,regions:s.aiReview.regions,reason:s.aiReview.reason},null,2):'无，待人工审查');const idx=Number((s.prediction||'').split('-').at(-1));$('reason').textContent=s.boundary?JSON.stringify(s.boundary,null,2):JSON.stringify(d.regionReasons[idx-1]||{},null,2);const r=reviews[s.id]||{};$('kind').value=r.kind||'unreviewed';$('region').value=r.region||'';$('neighbors').value=(r.neighbors||[]).join(',');$('note').value=r.note||'';if(seek){v.pause();v.currentTime=(s.tick+.05)/d.fps}render()}
function render(){const f=$('filter').value.toLowerCase();$('list').replaceChildren();d.samples.forEach((s,i)=>{if(!`${s.id} ${label(s)} ${JSON.stringify(s.aiReview?.regions||[])}`.toLowerCase().includes(f))return;const b=document.createElement('button');b.textContent=`${s.id} · 帧${s.tick} · ${label(s)} · ${reviews[s.id]?.kind||'未审核'}`;b.className=i===selected?'active':'';b.onclick=()=>choose(i);$('list').append(b)})}
d.samples.forEach((s,i)=>{const b=document.createElement('button');b.textContent=s.id.replace('observation-','#');b.title=`帧${s.tick} ${label(s)}`;b.className=s.boundary?'boundary':'';b.onclick=()=>choose(i);$('markers').append(b)});
v.ontimeupdate=()=>{const tick=Math.min(d.frameCount-1,Math.floor(v.currentTime*d.fps));$('timeline').value=tick;$('clock').textContent=`当前帧 ${tick} · 视频 ${v.currentTime.toFixed(1)}秒`;let i=d.samples.findLastIndex(s=>s.tick<=tick);if(i>=0&&i!==selected)choose(i,false)};$('timeline').oninput=e=>{v.pause();v.currentTime=(Number(e.target.value)+.05)/d.fps};for(const [id,delta] of [['prevFrame',-1],['nextFrame',1]])$(id).onclick=()=>{v.pause();v.currentTime=(Math.max(0,Math.min(d.frameCount-1,Math.floor(v.currentTime*d.fps)+delta))+.05)/d.fps};$('speed').onchange=e=>v.playbackRate=Number(e.target.value);$('filter').oninput=render;
$('save').onclick=()=>{const kind=$('kind').value,region=$('region').value.trim(),neighbors=$('neighbors').value.split(',').map(s=>s.trim()).filter(Boolean);if(kind==='core'&&!region){$('feedback').textContent='明确区域需要填写区域身份';return}if(kind==='boundary'&&neighbors.length<1){$('feedback').textContent='边界至少说明一个邻接区域；无法说明请选证据不足';return}reviews[d.samples[selected].id]={kind,region,neighbors,note:$('note').value,reviewer:$('reviewer').value.trim(),reviewedAt:new Date().toISOString()};try{localStorage.setItem(key,JSON.stringify(reviews));$('feedback').textContent='已保存，请导出备份'}catch{$('feedback').textContent='浏览器存储失败，请立即导出'}render()};
$('export').onclick=()=>{if(!$('reviewer').value.trim()){$('feedback').textContent='请填写审查者';return}const result={protocol:'human-region-review-v1',datasetId:d.datasetId,reportSha256:d.reportSha256,reviewer:$('reviewer').value.trim(),blind:false,assistedByAI:true,exportedAt:new Date().toISOString(),labels:d.samples.map(s=>({observationId:s.id,tick:s.tick,imageSha256:s.imageSha256,...(reviews[s.id]||{kind:'unreviewed'})}))};const url=URL.createObjectURL(new Blob([JSON.stringify(result,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download=d.datasetId+'-human-review.json';a.click();URL.revokeObjectURL(url)};choose(0,false)
})().catch(e=>{document.getElementById('summary').textContent='加载错误：'+e.message});
</script></html>
