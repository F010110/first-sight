<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>空间样本审核</title>
<style>body{margin:0;background:#101827;color:#e8edf7;font:15px system-ui}main{padding:12px}h1{font-size:20px;margin:0}button,input,textarea,select{font:inherit;padding:8px;border-radius:5px}button{cursor:pointer}header{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.layout{display:grid;grid-template-columns:minmax(0,3fr) minmax(280px,1fr);gap:12px;margin-top:10px;height:calc(100dvh - 100px)}.media,.side{min-height:0;overflow:auto;background:#202b40;padding:10px;border-radius:8px}video{width:100%;max-height:48vh;background:black}img{width:100%;max-height:22vh;object-fit:contain}#timeline{width:95%}.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}#list{overflow:auto;flex:1;min-height:80px}#list button{display:block;width:100%;text-align:left;margin:3px 0}.side{display:flex;flex-direction:column;gap:8px}textarea{box-sizing:border-box;width:100%;height:65px}pre{white-space:pre-wrap;margin:4px 0}.active{outline:2px solid #48bcff}#pass{background:#8de5bb}#fail{background:#ffc0b8}.muted{color:#b2bed2;font-size:12px}details{max-height:140px;overflow:auto}@media(max-width:700px){.layout{grid-template-columns:1fr;height:auto}.side{position:sticky;bottom:0}video{max-height:35vh}#list{max-height:120px}}</style>
<main><header><h1>空间样本审核</h1><button id="switchDataset">切换样本集</button><span id="summary"></span><button id="export">导出审核</button></header><dialog id="datasetDialog"><h3>选择样本集</h3><div id="datasetOptions"></div><button id="closeDataset">取消</button></dialog><p class="muted">左／前／右以暗色缝隙分隔。24fps重复原帧，无淡化；原素材2帧/秒，不代表新增转动细节。审核针对当前算法预测，AI审查标签仅作参考。</p>
<div class="layout"><section class="media"><video id="video" src="motion-hold.mp4" controls muted playsinline></video><input id="timeline" type="range" min="0" step="1"><div class="row"><button id="prevFrame">上一帧</button><button id="nextFrame">下一帧</button><select id="speed"><option>.5</option><option selected>1</option><option>2</option></select><span id="clock"></span></div><h3 id="sampleTitle"></h3><img id="still" alt="原时刻三视图"><details><summary>原AI审查及模型依据</summary><pre id="aiLabel"></pre><pre id="reason"></pre></details></section>
<aside class="side"><strong id="originalLabel"></strong><span id="originalReason"></span><span id="prediction"></span><strong>审核对象：原AI审核标签（不是算法预测）</strong><div class="row"><button id="prev">上一点</button><button id="next">下一点</button></div><textarea id="note" placeholder="不通过的理由（必填）"></textarea><div class="row"><button id="pass">原标签通过</button><button id="fail">原标签不通过</button></div><span id="feedback" aria-live="polite"></span><input id="filter" placeholder="搜索样本／区域"><div id="list"></div><span class="muted">点击即保存；请导出备份。原数据不覆盖。</span></aside></div></main>
<script>
(async()=>{const d=await fetch('data.json').then(r=>{if(!r.ok)throw Error('数据加载失败');return r.json()});const $=id=>document.getElementById(id),v=$('video');let selected=0,dragging=false;const key='region-review-original-v3:'+d.reportSha256+':'+d.datasetId;let reviews={};try{reviews=JSON.parse(localStorage.getItem(key)||'{}')}catch{}$('summary').textContent=`${d.datasetId} · ${d.samples.length}个样本`+(d.protocolWarning?' · 存在协议隔离未知组':'');$('timeline').max=d.frameCount-1;
const names={'kitchen-dining':'厨房／餐区','living-sofa':'客厅／沙发区','bedroom':'卧室','bathroom':'浴室','open-living':'开放生活区'};
names['open-living-area']='开放生活区';
$('switchDataset').onclick=async()=>{v.pause();$('datasetOptions').replaceChildren();try{const catalog=await fetch('../datasets.json').then(r=>{if(!r.ok)throw Error('样本目录加载失败');return r.json()});for(const entry of catalog){const b=document.createElement('button');b.textContent=`${entry.name} · ${entry.samples}个样本`;b.onclick=()=>location.href='../'+encodeURIComponent(entry.directory)+'/';$('datasetOptions').append(b)}$('datasetDialog').showModal()}catch(e){$('feedback').textContent=e.message}};$('closeDataset').onclick=()=>$('datasetDialog').close();
function regionName(r){if(d.datasetId==='region-val4-multiview'&&['kitchen-dining','living-sofa'].includes(r))return r==='kitchen-dining'?'??????????????':'??????????????';return names[r]||r}
function original(s){if(!s.aiReview)return '原AI审核：无标签，待标注';const regions=(s.aiReview.regions||[]).map(regionName).join(' ↔ ');return '原AI审核：'+(s.aiReview.kind==='boundary'?'边界／过渡：':s.aiReview.kind==='core'?'明确区域：':'待确认：')+(regions||'未知')}
function label(s){const idx=Number((s.prediction||'').split('-').at(-1));const reason=d.regionReasons[idx-1]?.reason||'';const name=/开放|起居|餐厨/.test(reason)?'开放生活区':/封闭卧室/.test(reason)?'卧室':/封闭卫生间/.test(reason)?'浴室':s.prediction||'未定';return s.boundary?'边界／过渡':name}
function status(r){return r?.decision==='pass'?'通过':r?.decision==='fail'?'不通过':r?'旧审核（保留）':'未审核'}
function choose(i,seek=true){selected=Math.max(0,Math.min(d.samples.length-1,i));const s=d.samples[selected];$('sampleTitle').textContent=`${s.id} · 原帧${s.tick}`;$('still').src=new URL(s.image.replaceAll('\\','/'),location.href).href;$('originalLabel').textContent=original(s);$('originalReason').textContent=s.aiReview?.reason||'此场景尚无原AI审核标签；不能用预测当真值。';$('pass').disabled=$('fail').disabled=!s.aiReview;$('prediction').textContent='算法预测（独立）：'+label(s);$('aiLabel').textContent=original(s);const idx=Number((s.prediction||'').split('-').at(-1));$('reason').textContent=JSON.stringify(s.boundary||d.regionReasons[idx-1]||{},null,2);$('note').value=reviews[s.id]?.note||'';$('feedback').textContent=status(reviews[s.id]);if(seek){v.pause();v.currentTime=Math.min(v.duration||Infinity,(s.tick+.05)/d.fps)}render()}
function render(){const f=$('filter').value.toLowerCase();$('list').replaceChildren();d.samples.forEach((s,i)=>{if(!`${s.id} ${original(s)} ${label(s)}`.toLowerCase().includes(f))return;const b=document.createElement('button');b.textContent=`${s.id.replace('observation-','#')} · ${original(s).replace('原AI审核：','')} · ${status(reviews[s.id])}`;b.className=i===selected?'active':'';b.onclick=()=>choose(i);$('list').append(b)})}
v.ontimeupdate=()=>{if(dragging)return;const tick=Math.min(d.frameCount-1,Math.floor(v.currentTime*d.fps));$('timeline').value=tick;$('clock').textContent=`原帧${tick} · ${v.currentTime.toFixed(1)}秒`;const i=d.samples.findLastIndex(s=>s.tick<=tick);if(i>=0&&i!==selected)choose(i,false)};$('timeline').onpointerdown=()=>{dragging=true;v.pause()};$('timeline').oninput=e=>{$('clock').textContent=`跳转到原帧${e.target.value}`};function seek(){dragging=false;v.pause();v.currentTime=Math.min(v.duration||Infinity,(Number($('timeline').value)+.05)/d.fps)}$('timeline').onchange=seek;$('timeline').onpointerup=seek;$('timeline').onpointercancel=()=>dragging=false;for(const [id,delta] of [['prevFrame',-1],['nextFrame',1]])$(id).onclick=()=>{v.pause();v.currentTime=(Math.max(0,Math.min(d.frameCount-1,Math.floor(v.currentTime*d.fps)+delta))+.05)/d.fps};$('prev').onclick=()=>choose(selected-1);$('next').onclick=()=>choose(selected+1);$('speed').onchange=e=>v.playbackRate=Number(e.target.value);$('filter').oninput=render;$('note').oninput=()=>v.pause();$('still').onerror=()=>{$('feedback').textContent='样本图片加载失败：'+d.samples[selected].image};v.onerror=()=>{$('clock').textContent='视频加载失败，请刷新或检查本地服务'};
function save(decision){v.pause();const note=$('note').value.trim();if(decision==='fail'&&!note){$('feedback').textContent='请填写不通过的理由';$('note').focus();return}const s=d.samples[selected];if(!s.aiReview)return;reviews[s.id]={decision,note,reviewTarget:'originalAIReview',originalAIReview:s.aiReview,reviewedAt:new Date().toISOString()};try{localStorage.setItem(key,JSON.stringify(reviews));$('feedback').textContent=status(reviews[s.id])+'，已保存'}catch{$('feedback').textContent='存储失败，请立即导出'}render()}
$('pass').onclick=()=>save('pass');$('fail').onclick=()=>save('fail');$('export').onclick=()=>{const result={protocol:'human-original-label-approval-v3',datasetId:d.datasetId,reportSha256:d.reportSha256,blind:false,assistedByAI:true,exportedAt:new Date().toISOString(),labels:d.samples.map(s=>({observationId:s.id,tick:s.tick,imageSha256:s.imageSha256,...(reviews[s.id]||{decision:'unreviewed'})}))};const url=URL.createObjectURL(new Blob([JSON.stringify(result,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download=d.datasetId+'-human-review.json';a.click();URL.revokeObjectURL(url)};choose(0,false)
})().catch(e=>{document.getElementById('summary').textContent=e.message});
</script></html>
