<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>First Sight · 手机语音端</title>
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/mobile.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1>First Sight</h1>
      <span>手机语音伴侣</span>
    </div>
    <span id="conn-pill" class="pill warn">正在连接…</span>
  </header>

  <main class="mobile-shell">
    <section id="token-card" class="card" hidden>
      <strong>请输入配对码 (Token)</strong>
      <div class="ask-form">
        <input id="token-input" class="text-input" type="text" placeholder="查看电脑端链接中的 token">
        <button id="token-save" type="button" class="primary">连接</button>
      </div>
    </section>

    <button id="btn-unlock" type="button" class="primary big-unlock-btn">
      点击开启手机语音播报（iPhone / Android 必点一次）
    </button>

    <button id="btn-tap-speak" type="button" class="tap-speak-alert" hidden>
      系统浏览器拦截了后台自动发声，点这里立即朗读最新回答
    </button>

    <section class="card">
      <div class="voice-bar">
        <label class="toggle-label">
          <input type="checkbox" id="auto-speak" checked>
          收到新回答自动语音播报
        </label>
        <label class="toggle-label">
          语速
          <select id="rate-select" class="text-input">
            <option value="0.9">0.9x</option>
            <option value="1" selected>1.0x</option>
            <option value="1.15">1.15x</option>
            <option value="1.3">1.3x</option>
          </select>
        </label>
        <button id="btn-stop-speech" type="button" class="danger">停止播报</button>
      </div>
      <div id="voice-status" class="muted">请先点击上方蓝色按钮激活手机语音。</div>
    </section>

    <section class="card">
      <div class="section-title">
        <h2>快速触发</h2>
        <span id="cam-pill" class="pill warn">相机检测中…</span>
      </div>
      <div class="mobile-actions">
        <button id="m-describe" type="button" class="primary">环境描述</button>
        <button id="m-ocr" type="button" class="primary">读文字</button>
        <button id="m-identify" type="button" class="primary">识物</button>
      </div>
      <form id="m-ask-form" class="ask-form">
        <button id="m-mic" type="button" title="语音输入">🎤</button>
        <input id="m-input" class="text-input" type="text" maxlength="1000" placeholder="输入或语音提问…">
        <button id="m-send" type="submit" class="primary">发送</button>
      </form>
      <div id="mic-hint" class="muted"></div>
      <div id="m-error" class="error-banner" hidden></div>
    </section>

    <section class="card">
      <div class="section-title">
        <h2>最新播报内容</h2>
        <button id="btn-replay-latest" type="button" disabled>重播</button>
      </div>
      <div id="latest-text" class="mobile-latest">等待电脑端或手机端发起识别…</div>
    </section>

    <section class="card">
      <h2>历史记录</h2>
      <div id="m-history" class="qa-feed"></div>
    </section>
  </main>
</body>
</html>
