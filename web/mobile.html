<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>First Sight · 手机语音端</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="mobile-shell">
    <header class="topbar" style="margin-bottom:0;">
      <div class="brand">
        <div class="brand-mark">FS</div>
        <div>
          <h1>First Sight</h1>
          <div class="brand-sub">手机语音播报端</div>
        </div>
      </div>
      <span id="mobile-status" class="pill"><span class="dot"></span>未连接</span>
    </header>

    <section id="connect-card" class="card">
      <div class="card-head">
        <h2 class="card-title">配对连接</h2>
        <span class="card-meta">默认配对码：hjl</span>
      </div>
      <form id="token-form" class="input-row">
        <input id="token-input" class="input" type="text" placeholder="输入配对码 (默认 hjl)" value="hjl" />
        <button class="btn btn-primary" type="submit">连接</button>
      </form>
    </section>

    <button id="btn-unlock-audio" class="btn btn-primary" style="width:100%;padding:14px;font-size:15px;">
      点击开启语音播报
    </button>

    <button id="btn-ios-fallback" class="ios-fallback" hidden>
      浏览器拦截了自动朗读，点此立即播报
    </button>

    <section class="mobile-hero">
      <div class="card-head">
        <h2 class="card-title">实时语音字幕</h2>
        <span id="subtitle-time" class="card-meta">等待播报</span>
      </div>
      <div id="subtitle-box" class="mobile-subtitle">连接后，电脑端的视觉回答与持续关注提醒都会在这里自动朗读。</div>
    </section>

    <section class="card">
      <div class="card-head">
        <h2 class="card-title">快捷提问</h2>
      </div>
      <div class="quick-row">
        <button class="btn btn-soft" data-mode="describe">描述环境</button>
        <button class="btn" data-mode="ocr">读文字</button>
        <button class="btn" data-mode="identify">识物品</button>
      </div>
    </section>

    <section class="card">
      <div class="card-head">
        <h2 class="card-title">持续关注</h2>
      </div>
      <form id="m-watch-form" class="input-row">
        <input id="m-watch-input" class="input" type="text" placeholder="关注目标，如：前方有人" />
        <button id="m-watch-start" class="btn btn-primary" type="submit">开启</button>
        <button id="m-watch-stop" class="btn btn-danger" type="button" hidden>停止</button>
      </form>
      <div id="m-watch-banner" class="watch-banner" hidden></div>
    </section>
  </div>

  <div id="toast" class="toast" hidden></div>
  <script type="module" src="/mobile.js"></script>
</body>
</html>
