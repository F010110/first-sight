<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>First Sight · 多视角视觉助手</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">FS</div>
        <div>
          <h1>First Sight</h1>
          <div class="brand-sub">三视角实时感知 · 手机语音播报</div>
        </div>
      </div>

      <div class="status-pills">
        <span id="pill-cameras" class="pill"><span class="dot"></span>相机 0/3</span>
        <span id="pill-mobile" class="pill"><span class="dot"></span>手机语音 0</span>
        <span id="pill-qwen" class="pill"><span class="dot"></span>Qwen</span>
      </div>

      <div class="top-actions">
        <button id="btn-open-mobile" class="btn btn-soft">手机连接</button>
        <button id="btn-open-devices" class="btn hide-in-present">设备管理</button>
        <button id="btn-present" class="btn">演示模式</button>
        <a class="btn hide-in-present" href="/replay.html">回放</a>
      </div>
    </header>

    <main class="workspace">
      <section class="camera-stage" aria-label="三路实时相机">
        <div class="cam-card hero">
          <img id="img-front" alt="正前方画面" hidden />
          <div id="empty-front" class="cam-empty">正前方等待画面…</div>
          <div id="badge-front" class="cam-badge"><span class="dot"></span>正前方</div>
        </div>
        <div class="cam-subgrid">
          <div class="cam-card">
            <img id="img-left" alt="左侧画面" hidden />
            <div id="empty-left" class="cam-empty">左侧等待画面…</div>
            <div id="badge-left" class="cam-badge"><span class="dot"></span>左侧</div>
          </div>
          <div class="cam-card">
            <img id="img-right" alt="右侧画面" hidden />
            <div id="empty-right" class="cam-empty">右侧等待画面…</div>
            <div id="badge-right" class="cam-badge"><span class="dot"></span>右侧</div>
          </div>
        </div>
      </section>

      <aside class="panel-stack">
        <section class="card">
          <div class="card-head">
            <h2 class="card-title">AI 视觉回答</h2>
            <span id="answer-meta" class="card-meta">等待提问</span>
          </div>
          <div id="answer-box" class="answer-box placeholder">点击下方快捷按钮或输入问题，系统将结合前/左/右三路最新画面回答并推送到手机语音播报。</div>
          <div class="answer-actions">
            <span id="speak-hint" class="card-meta"></span>
            <div style="display:flex;gap:8px;">
              <button id="btn-local-speak" class="btn btn-sm" disabled>本机朗读</button>
              <button id="btn-push-speak" class="btn btn-sm btn-soft" disabled>推送手机播报</button>
            </div>
          </div>
        </section>

        <section class="card">
          <div class="card-head">
            <h2 class="card-title">实时问答</h2>
          </div>
          <div class="quick-row">
            <button class="btn btn-primary" data-mode="describe">描述环境</button>
            <button class="btn" data-mode="ocr">读取文字</button>
            <button class="btn" data-mode="identify">识别物品</button>
          </div>
          <form id="ask-form" class="input-row">
            <input id="ask-input" class="input" type="text" placeholder="输入自定义问题，例如：我左边桌子上有什么？" maxlength="300" />
            <button id="btn-ask-send" class="btn btn-primary" type="submit">提问</button>
          </form>
        </section>

        <section class="card">
          <div class="card-head">
            <h2 class="card-title">持续关注</h2>
            <span class="card-meta">命中后继续监测</span>
          </div>
          <form id="watch-form" class="input-row">
            <input id="watch-input" class="input" type="text" placeholder="关注目标，如：有人靠近 / 出现水杯" maxlength="200" />
            <button id="btn-watch-start" class="btn btn-primary" type="submit">开始</button>
            <button id="btn-watch-stop" class="btn btn-danger" type="button" hidden>停止</button>
          </form>
          <div id="watch-banner" class="watch-banner" hidden></div>
        </section>

        <section class="card hide-in-present">
          <div class="card-head">
            <h2 class="card-title">最近记录</h2>
            <span id="history-count" class="card-meta">0 条</span>
          </div>
          <div id="history-list" class="history-list">
            <div class="card-meta">暂无问答记录</div>
          </div>
        </section>
      </aside>
    </main>
  </div>

  <!-- Mobile Connection Modal -->
  <div id="modal-mobile" class="modal-backdrop" hidden>
    <div class="modal">
      <div class="card-head">
        <h2 class="card-title">手机语音端连接</h2>
        <button class="btn btn-sm" data-close-modal="modal-mobile">关闭</button>
      </div>
      <div style="text-align:center;">
        <div id="qr-container" class="qr-wrap"></div>
        <div style="margin:10px 0;">
          <span class="token-chip">配对码 Token: <span id="token-text">hjl</span></span>
        </div>
        <div id="mobile-url-text" class="card-meta" style="word-break:break-all;margin-bottom:12px;"></div>
        <button id="btn-copy-url" class="btn btn-soft btn-sm">复制手机链接</button>
      </div>
    </div>
  </div>

  <!-- Device Management Modal -->
  <div id="modal-devices" class="modal-backdrop" hidden>
    <div class="modal">
      <div class="card-head">
        <h2 class="card-title">设备与相机管理</h2>
        <button class="btn btn-sm" data-close-modal="modal-devices">关闭</button>
      </div>
      <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;">
        <span id="locate-msg" class="card-meta">支持 mDNS 自动发现</span>
        <button id="btn-locate" class="btn btn-primary btn-sm">自动定位相机</button>
      </div>
      <form id="hosts-form">
        <div class="field-grid">
          <label class="field-label" for="host-front">正前方</label>
          <input id="host-front" class="input" placeholder="如 192.168.137.149" />
          <label class="field-label" for="host-left">左侧</label>
          <input id="host-left" class="input" placeholder="如 192.168.137.19" />
          <label class="field-label" for="host-right">右侧</label>
          <input id="host-right" class="input" placeholder="如 192.168.137.169" />
        </div>
        <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:12px;">
          <button class="btn btn-soft btn-sm" type="submit">保存 IP</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script type="module" src="/desktop.js"></script>
</body>
</html>
