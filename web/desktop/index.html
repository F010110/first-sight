<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>First Sight · 校园助手</title><link rel="stylesheet" href="/style.css"><script type="module" src="/app.js"></script></head>
<body>
<header><a class="brand" href="/">First Sight<span>校园生活助手</span></a><span id="status" role="status" aria-live="polite">正在载入…</span></header>
<main>
 <section class="scene" aria-labelledby="scene-title">
  <div class="section-heading"><h1 id="scene-title">当前视图</h1><div class="controls"><label class="sr-only" for="source">选择实时会话或回放</label><select id="source"><option value="live">实时会话</option></select><button id="play" type="button">播放</button></div></div>
  <div id="views" class="views"><p class="empty">等待画面</p></div>
  <video id="continuous-video" hidden playsinline preload="metadata" aria-label="校园原生10帧每秒连续画面，左侧、前方、右侧三视图"></video>
  <button id="next-question" type="button" hidden>下一问</button>
  <div class="scene-meta"><span>样本时间 <time id="sample-time">--:--:--</time></span><span>位置 <strong id="location-name">尚未判断</strong></span></div>
  <div class="timeline"><label class="sr-only" for="position">回放位置</label><input id="position" type="range" min="0" max="0" value="0" disabled><span id="progress">校园录制画面 · 非真实现场直播</span></div>
 </section>
 <div class="dialogue">
  <section class="panel" aria-labelledby="question-title"><h2 id="question-title">用户问题</h2><div id="questions" class="messages" role="log" aria-live="polite"><p class="empty">暂无问题</p></div><form id="question-form"><label class="sr-only" for="question">输入问题</label><textarea id="question" rows="2" maxlength="2000" placeholder="输入你想问的问题…"></textarea><button id="send" type="submit">发送</button></form></section>
  <section class="panel answer-panel" aria-labelledby="answer-title"><h2 id="answer-title">VLM语音输出<span class="subtitle">文字展示</span></h2><div id="answers" class="messages" role="log" aria-live="polite"><p class="empty">等待助手回答</p></div></section>
 </div>
</main>
</body></html>
