<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>First Sight · 录像回放</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/recordings.css"><script type="module" src="/recordings.js"></script></head><body><header><a class="brand" href="/realtime.html">First Sight<span>录像回放</span></a><a href="/realtime.html">返回实时</a></header><main><div class="toolbar"><select id="recording-select" aria-label="选择记录"><option value="">正在读取记录…</option></select><button id="refresh">刷新记录</button><span id="status" role="status"></span></div><div class="replay-grid"><section class="panel"><div class="picture"><img id="frame" hidden alt="已记录前方原图"><span id="empty">开启记录后，画面会自动进入这里</span></div><div class="transport"><button id="play" disabled>播放</button><input id="seek" type="range" min="0" max="0" value="0" aria-label="回放时间轴" disabled><select id="speed" aria-label="播放速度"><option value="1">1×</option><option value="2">2×</option><option value="4">4×</option></select></div><p id="frame-time"></p><p id="location">尚无记录</p><p id="gap"></p></section><section class="panel evidence"><h2>当时的空间记忆与问答</h2><p class="note">只读原记录，不调用模型。判断和回答按产生时间显示，不提前展示未来结果。</p><div id="places"></div><div id="questions"></div></section></div><footer>单摄前方原图 · 未记录的间隔不会补图 · 已有记录不会因关闭记录而删除</footer></main></body></html>
