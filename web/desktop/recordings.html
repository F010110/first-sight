<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>First Sight · 统一回放</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/recordings.css"><script type="module" src="/recordings.js"></script></head>
<body><header><a class="brand" href="/">First Sight<span>回放</span></a><nav><a href="/">统一入口</a> · <a href="/realtime.html">实时助手</a></nav></header>
<main><div class="toolbar"><label>来源 <select id="replay-source"><option value="real">真实记录</option><option value="simulation">模拟样本</option></select></label><select id="recording-select" aria-label="选择记录"><option value="">正在读取…</option></select><button id="refresh">刷新记录</button><span id="status" role="status"></span></div>
<div class="replay-grid"><section class="panel"><p id="sample-scope"></p><div class="player" tabindex="0" aria-label="回放播放器，空格播放或暂停"><div class="picture"><video id="real-video" controls playsinline preload="metadata" hidden aria-label="真实原片播放器"></video><img id="frame" hidden alt="当前记录原图"><div id="multi-view" hidden></div><span id="empty">请选择记录</span></div>
<div class="transport"><button id="play" class="icon-control" aria-label="播放" title="播放（空格）" disabled>▶</button><span id="player-time">0:00 / 0:00</span><input id="seek" type="range" min="0" max="0" value="0" aria-label="回放时间轴" disabled><button id="skip-pause" hidden disabled title="跳到下一段密集采样；不代表识别了人物活动">跳过停顿 ⏭</button><select id="speed" aria-label="播放速度"><option value="1">1×</option><option value="2">2×</option><option value="4">4×</option></select><select id="view-mode" aria-label="显示视角" hidden><option value="all">三视图</option><option value="front">前方</option><option value="left">左侧</option><option value="right">右侧</option></select><button id="fullscreen" class="icon-control" aria-label="全屏" title="全屏">⛶</button></div></div><p id="skip-notice" role="status"></p><p id="frame-time"></p><p id="location">尚无记录</p><p id="gap"></p></section>
<section class="panel evidence"><h2>当时的空间记忆与问答</h2><p class="note">只读已有记录，不调用模型。判断和回答按产生时间显示，不提前展示未来结果。模拟位姿与答案真值不混入此处。</p><div id="places"></div><div id="questions"></div></section></div>
<footer id="replay-note">真实与模拟共用本机入口 · 不补造缺失画面 · 不修改已有记录</footer></main></body></html>
